<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline: OAK</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F7F2E7; color: #23211C; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    img { height: 56px; }
    h1 { margin: 20px 0 8px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 1.9rem; color: #1F3A2D; }
    p { margin: 0 0 24px; color: #5F5545; line-height: 1.6; max-width: 26rem; }
    button { background: #1F3A2D; color: #F7F2E7; border: 0; border-radius: 4px; padding: 12px 22px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #16291F; }
  </style>
</head>
<body>
  <main>
    <img src="/images/oak/brand/oak-mark.svg" alt="OAK" />
    <h1>You're offline</h1>
    <p>OAK needs an internet connection. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
