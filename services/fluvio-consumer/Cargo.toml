[package]
name = "fluvio-consumer"
version = "0.1.0"
edition = "2021"
description = "Fluvio event consumer for WhatsApp Commerce real-time stream processing"

[[bin]]
name = "fluvio-consumer"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client for forwarding events
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Error handling
anyhow = "1"
# Config from env
dotenvy = "0.15"
# HTTP server for health endpoint
axum = { version = "0.8", features = ["json"] }
# Fluvio client. QA-045/046: this was previously `optional = true` behind a `fluvio-enabled`
# feature that the Dockerfile's `cargo build --release` never passed — so the crate was declared
# but never actually compiled in, and the consumer loop below was, in its own docstring's words,
# "Simulated ... replace with real Fluvio SDK calls" — a placeholder that hit a REST API
# (`GET {sc}/topics/:name/records`) fluvio-sc has never implemented, failing every ~5s, continuously,
# since the day this service was deployed. Now required (not optional): there is no meaningful
# no-Fluvio build of a service whose only job is talking to Fluvio.
fluvio = "0.50"
futures-util = "0.3"

# === W35 otel ===
opentelemetry = "0.30"
opentelemetry_sdk = "0.30"
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.31"
# === END W35 otel ===

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
