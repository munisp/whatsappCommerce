[package]
name = "message-processor"
version = "1.0.0"
edition = "2021"
description = "High-performance Kafka message processor for WhatsApp Commerce"

[[bin]]
name = "message-processor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "6"

# W42 PLT-7: durable DLQ backend — Redis list (sync connection; the async
# consumer loop can upgrade to tokio-comp when rdkafka lands).
redis = { version = "0.27" }

# === W45 go-rust-services (MSG-18) ===
# Real Kafka consumer + DLQ topic producer. cmake-build vendors librdkafka
# at image build time (see Dockerfile — bookworm builder with cmake).
rdkafka = { version = "0.39", features = ["cmake-build"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

