# APISIX standalone routes (loaded when deployment.role = standalone).
# Keep in sync with services/middleware/apisix-config/routes.yaml when adding routes.
routes:
  - uri: /api/*
    name: platform-api
    upstream:
      type: roundrobin
      nodes:
        "api-gateway:8080": 1
    plugins:
      request-id: {}
      cors: {}
      # === W35 infra-receivers (Coder D) ===
      # Trace this route; plugin config lives in config.yaml plugin_attr.
      opentelemetry: {}
      # === END W35 infra-receivers ===
#END
