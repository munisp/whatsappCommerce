apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ai-agent
    app.kubernetes.io/name: ai-agent
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: ai-agent-0.1.0
  name: ai-agent
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: ai-agent
      app.kubernetes.io/name: ai-agent
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ai-agent
        app.kubernetes.io/name: ai-agent
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: ai-agent-0.1.0
    spec:
      containers:
      - env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              key: value
              name: whatsapp-ai-agent-redis-url
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-ai-agent:20260918-1642 # {"$imagepolicy": "flux-system:whatsapp-ai-agent"}
        imagePullPolicy: IfNotPresent
        name: ai-agent
        ports:
        - containerPort: 8090
          name: port-8090
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
