apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ledger-bridge
    app.kubernetes.io/name: ledger-bridge
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: ledger-bridge-0.1.0
  name: ledger-bridge
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: ledger-bridge
      app.kubernetes.io/name: ledger-bridge
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ledger-bridge
        app.kubernetes.io/name: ledger-bridge
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: ledger-bridge-0.1.0
    spec:
      containers:
      - env:
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-ledger-bridge:20260831-1409 # {"$imagepolicy": "flux-system:whatsapp-ledger-bridge"}
        imagePullPolicy: IfNotPresent
        name: ledger-bridge
        ports:
        - containerPort: 8095
          name: port-8095
          protocol: TCP
        # QA-013 (sibling of QA-012): this deployment had no probes at all.
        # Both probes use the shallow /health (process alive, always 200).
        #
        # Deliberately NOT /health/ready for readiness, even though that
        # deeper endpoint exists: the live cluster's ledger-bridge reports
        # tigerbeetle.healthy=false and postgres.healthy=false (TigerBeetle
        # isn't running there and no DATABASE_URL is set), and the platform's
        # documented design (docs/RESILIENCE.md) is graceful degradation — the
        # bridge answers a fast, honest 503 ledger_unavailable so payments fail
        # clearly while everything else keeps serving. A deep readinessProbe
        # would instead pull the only replica out of its Service, turning that
        # honest 503 into connection errors, and would never go Ready here.
        # Switch readiness to /health/ready only in an environment with a
        # healthy TigerBeetle AND multiple bridge replicas, where routing
        # around a replica that has lost TigerBeetle actually helps.
        readinessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
