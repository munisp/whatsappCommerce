apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ledger-bridge
    app.kubernetes.io/name: ledger-bridge
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: ledger-bridge-0.1.0
  name: ledger-bridge
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  # 2 replicas: proven safe across replicas by tests/e2e/ledger-ha.test.ts (idempotency, commit/void/reverse and
  # concurrency hold when a Service load-balances calls across pods) against ONE TigerBeetle and ONE Postgres.
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: ledger-bridge
      app.kubernetes.io/name: ledger-bridge
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ledger-bridge
        app.kubernetes.io/name: ledger-bridge
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: ledger-bridge-0.1.0
    spec:
      containers:
      - env:
        - name: OTEL_ENABLED
          value: "true"
        # QA-042: gRPC port 4317, NOT the HTTP port 4318. This service builds its OTLP exporter with `.with_tonic()` (gRPC); pointed
        # at 4318 every span export failed with `transport error`, so it never appeared in Jaeger and span-derived alerts had nothing to read.
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4317
        # Durable idempotency + transfer journal (ledger_transfers, created by the bridge itself).
        # Same secret the app uses, so the bridge follows the app if the database is ever moved.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: whatsapp-postgres-dsn
        # The bridge's TigerBeetle client is HTTP; the tb-adapter sidecar below turns it into the
        # native protocol. Loopback, because it is in the same pod.
        - name: TIGERBEETLE_ADDRESS
          value: 127.0.0.1:3000
        - name: TIGERBEETLE_CLUSTER_ID
          value: "0" # ignored by the adapter, which uses the real cluster id below
        # Never fabricate ledger results in a shared/real environment: an unreachable ledger must
        # fail closed (503 ledger_unavailable), not fall back to a non-durable in-memory ledger.
        - name: LEDGER_ALLOW_INMEMORY
          value: "false"
        # Without this the bridge logs nothing at all, which leaves a ledger incident undiagnosable.
        - name: RUST_LOG
          value: info
        # QA-038: the shared service-to-service secret. Every route except /health and /health/ready requires it
        # once set. Same Secret and key that `server` sends and `recon-worker` sends/checks, so caller and callee
        # can never disagree on where it comes from. No `optional: true`: if the Secret is missing the pod must
        # fail to start, not start unauthenticated. (The tb-adapter sidecar below does NOT get it: it is loopback-
        # only and only the bridge talks to it.)
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              key: INTERNAL_API_KEY
              name: whatsapp-server-internal-api-key
        # QA-039: fail closed. Without this an unset/EMPTY INTERNAL_API_KEY means "serve every ledger route to anyone
        # who can reach the pod"; with it that state refuses to start (a crash-loop is loud, an open ledger is not).
        - name: REQUIRE_INTERNAL_API_KEY
          value: "true"
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-ledger-bridge:20260831-1409 # {"$imagepolicy": "flux-system:whatsapp-ledger-bridge"}
        imagePullPolicy: IfNotPresent
        name: ledger-bridge
        ports:
        - containerPort: 8095
          name: port-8095
          protocol: TCP
        # QA-013 (sibling of QA-012): this deployment had no probes at all.
        # Both probes use the shallow /health (process alive, always 200).
        #
        # Deliberately NOT /health/ready for readiness, even though that
        # deeper endpoint exists: the platform's documented design
        # (docs/RESILIENCE.md) is graceful degradation — when TigerBeetle or
        # Postgres is down the bridge answers a fast, honest 503
        # ledger_unavailable so payments fail clearly while everything else
        # keeps serving. A deep readinessProbe would instead pull the only
        # replica out of its Service, turning that honest 503 into connection
        # errors. Switch readiness to /health/ready only with multiple bridge
        # replicas, where routing around a replica that has lost TigerBeetle
        # actually helps (and only after multi-replica replay is tested).
        readinessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        # QA-042: on pod deletion, keep serving for a few seconds BEFORE the SIGTERM (kube-proxy needs a second or two to
        # stop sending the terminating pod NEW connections), then SIGTERM — which the bridge now honours (drain + exit).
        # Before this fix the bridge ignored SIGTERM entirely and lived on, headless, for the whole grace period.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      # TigerBeetle speaks a binary protocol, not HTTP, and the bridge's client is HTTP. Until this
      # existed only an in-memory test double implemented that contract, so the bridge had never
      # run against a real ledger. See services/tb-adapter and docs/RESILIENCE.md "Ledger wiring".
      - name: tb-adapter
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-tb-adapter:qa-local1
        imagePullPolicy: Never # locally shipped like the other qa-local images (see project notes)
        env:
        - name: HOST
          value: 127.0.0.1 # loopback only: the bridge is the sole client
        - name: PORT
          value: "3000"
        # The SHARED TigerBeetle (ns tigerbeetle) — also used by lanai and vpp in this cluster, confirmed
        # live (their Deployments point at the same hostnames). Reformatted 2026-09-21 from 1 replica to a
        # 3-replica cluster at the owner's explicit direction (see docs/RESILIENCE.md "Multi-node TigerBeetle
        # deployment notes" for why growing it in place is destructive and was not done unilaterally, and
        # for the pre-reformat backup that was attempted).
        #
        # All THREE replica hostnames are listed, not just replica 0: a client that only knows one address
        # still works (it forwards to whichever replica is primary — verified), but has NO fallback if that
        # one address goes down, even with the other two healthy. lanai and vpp still only know replica 0 —
        # they keep working unmodified, but only WE get the redundancy benefit until they update their own
        # configs too (their manifests are not ours to change).
        # Not secret: the cluster id is in the StatefulSet spec. Hostnames are resolved to an IP on every
        # reconnect by the adapter (a pod IP changes on restart).
        - name: TB_CLUSTER_ID
          value: "145851240909969808468846706535455565498"
        - name: TB_ADDRESSES
          value: tigerbeetle-0.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3000,tigerbeetle-1.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3000,tigerbeetle-2.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          # The TigerBeetle client uses io_uring, which the runtime-default seccomp profile blocks
          # (the container exits with "io_uring is not available"). Stated explicitly so that turning
          # on cluster-wide RuntimeDefault later fails loudly here instead of crash-looping.
          seccompProfile:
            type: Unconfined
        # Liveness only asks "is the process answering on its socket", never "is TigerBeetle up":
        # the adapter's /api/v1/health reflects TigerBeetle, and restarting the adapter cannot fix a
        # TigerBeetle outage (that state is already visible as tigerbeetle.healthy on the bridge's
        # /health). No readinessProbe for the same reason: a sidecar failing readiness would take the
        # bridge out of its Service.
        # It is an exec probe, not tcpSocket/httpGet, because the adapter listens on 127.0.0.1 ONLY
        # (binding 0.0.0.0 would expose an unauthenticated ledger-writing endpoint to every pod in
        # the cluster, and there are no NetworkPolicies) and kubelet probes connect to the pod IP —
        # a tcpSocket probe was refused and restart-looped the container.
        livenessProbe:
          exec:
            command:
            - node
            - -e
            - require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 300m
            ephemeral-storage: 64Mi
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        # QA-042: OUTLIVE the bridge's drain. kubelet signals both containers together; the adapter has always honoured
        # SIGTERM and used to exit in ~3 s, leaving the bridge (which then ignored SIGTERM) answering 503 ledger_unavailable
        # for the rest of the grace period. Now the bridge stops after ~5 s and the adapter after ~10 s, so every request
        # the bridge is still draining has a working adapter. 10 s + shutdown fits comfortably in terminationGracePeriodSeconds.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
        volumeMounts:
        - mountPath: /tmp
          name: adapter-tmp
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: ledger-bridge
            app.kubernetes.io/name: ledger-bridge
        # QA-042: count only pods of the SAME REVISION. The selector above matches every revision, so during a rolling update
        # the still-running OLD pods (one per node) bias the count, the second new pod sees a tie between nodes, and picks by
        # chance — measured: after two consecutive rollouts of `server` both replicas landed on ONE node (first worker, then
        # the other), a single-node-loss outage that looked healthy. `pod-template-hash` makes the new pods spread among
        # themselves. (Soft on purpose: a one-node cluster must still schedule both.)
        matchLabelKeys:
        - pod-template-hash
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      volumes:
      - name: adapter-tmp
        emptyDir:
          sizeLimit: 32Mi
