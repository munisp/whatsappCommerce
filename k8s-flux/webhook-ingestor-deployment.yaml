apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: webhook-ingestor
    app.kubernetes.io/name: webhook-ingestor
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: webhook-ingestor-0.1.0
  name: webhook-ingestor
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: webhook-ingestor
      app.kubernetes.io/name: webhook-ingestor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: webhook-ingestor
        app.kubernetes.io/name: webhook-ingestor
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: webhook-ingestor-0.1.0
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: whatsapp-postgres-dsn
        - name: KAFKA_BROKERS
          value: mojaloop-kafka-cluster-kafka-bootstrap.kafka.svc:9092
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-webhook-ingestor:20260918-1642 # {"$imagepolicy": "flux-system:whatsapp-webhook-ingestor"}
        imagePullPolicy: Always
        name: webhook-ingestor
        ports:
        - containerPort: 8081
          name: port-8081
          protocol: TCP
        # QA-013: sibling of QA-012 — this deployment had no probes at
        # all either. Uses the service's existing /health endpoint (already
        # exercised by tests/e2e/smoke.test.ts against the real service).
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
