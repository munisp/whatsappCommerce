apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: recon-worker
    app.kubernetes.io/name: recon-worker
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: recon-worker-0.1.0
  name: recon-worker
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: recon-worker
      app.kubernetes.io/name: recon-worker
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: recon-worker
        app.kubernetes.io/name: recon-worker
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: recon-worker-0.1.0
    spec:
      containers:
      - env:
        - name: LEDGER_BRIDGE_URL
          value: http://ledger-bridge.whatsapp-commerce.svc.cluster.local:8095
        # QA-034: the reconciler had NO database configured, so it could not compare payment intents with the
        # ledger at all — nothing reconciled the (now real) ledger against what the platform believes. It reads
        # payment_intents directly and reports discrepancies to the platform's internal events endpoint.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: whatsapp-postgres-dsn
        - name: PLATFORM_API_URL
          value: http://server.whatsapp-commerce.svc.cluster.local:3000
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              key: INTERNAL_API_KEY
              name: whatsapp-server-internal-api-key
        # QA-039: fail closed — an unset/empty INTERNAL_API_KEY refuses to start instead of leaving /recon/trigger (which
        # runs the ledger repair pass) unauthenticated.
        - name: REQUIRE_INTERNAL_API_KEY
          value: "true"
        - name: RUST_LOG
          value: info
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-recon-worker:20260916-1122 # {"$imagepolicy": "flux-system:whatsapp-recon-worker"}
        imagePullPolicy: IfNotPresent
        name: recon-worker
        ports:
        - containerPort: 8096
          name: port-8096
          protocol: TCP
        # QA-013: sibling of QA-012 — this deployment had no probes at
        # all either. Uses the service's existing /health endpoint (already
        # exercised by tests/e2e/smoke.test.ts against the real service).
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
