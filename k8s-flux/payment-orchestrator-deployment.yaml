apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: payment-orchestrator
    app.kubernetes.io/name: payment-orchestrator
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: payment-orchestrator-0.1.0
  name: payment-orchestrator
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: payment-orchestrator
      app.kubernetes.io/name: payment-orchestrator
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: payment-orchestrator
        app.kubernetes.io/name: payment-orchestrator
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: payment-orchestrator-0.1.0
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: whatsapp-postgres-dsn
        - name: KAFKA_BROKERS
          value: mojaloop-kafka-cluster-kafka-bootstrap.kafka.svc:9092
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-payment-orchestrator:20260831-1409 # {"$imagepolicy": "flux-system:payment-orchestrator:tag"}
        imagePullPolicy: Always
        name: payment-orchestrator
        ports:
        - containerPort: 8084
          name: port-8084
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30