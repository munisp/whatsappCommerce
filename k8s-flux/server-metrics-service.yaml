apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: server
    app.kubernetes.io/name: server
  name: server-metrics
  namespace: whatsapp-commerce
spec:
  # Headless (no clusterIP) companion to the `server` Service, used only as
  # a DNS A-record source for Prometheus dns_sd_configs. The normal `server`
  # Service load-balances traffic across both pods, so scraping it by name
  # lets each 30s scrape land on either pod at random - Prometheus then sees
  # one series alternate between two independent processes' counters, which
  # looks like the counter going backwards and fires spurious Elevated5xx/
  # ReadinessFlapping alerts. Resolving this name returns one A record per
  # pod IP, so dns_sd_configs can scrape each pod as its own target/series.
  clusterIP: None
  ports:
  - name: port-3000
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app.kubernetes.io/instance: server
    app.kubernetes.io/name: server
