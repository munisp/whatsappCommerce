# A 3-replica TigerBeetle cluster dedicated to the whatsapp-commerce ledger.
#
# WHY THIS EXISTS: the shared TigerBeetle in namespace `tigerbeetle` is ONE replica and another team's;
# TigerBeetle fixes its replica count when the data file is formatted, so it cannot be grown in place.
# Payments now depend on the ledger, and with a single replica any restart, OOM-kill or node drain is a
# payments outage. This cluster tolerates the loss of any ONE replica with no interruption, and fails
# honestly (503 from the adapter, "ledger_unavailable" from the bridge) when two are down.
# Proven before it was deployed (docker, same image): with 1 of 3 down, writes continued; with 2 down they
# failed after the adapter's 4 s bound; on restart they recovered in seconds
# (docs/RESILIENCE.md "Ledger high availability").
#
# THE ONE HARD PART — ADDRESSES: TigerBeetle 0.16 accepts only IP addresses in --addresses ("invalid IPv4 or
# IPv6 address" for a hostname), and a pod IP changes on every restart. So each replica gets its own Service
# with a STATIC ClusterIP (10.96.240.10-12, verified free in the 10.96.0.0/16 service range); that address is
# stable across pod restarts and is what the peers and the adapter are configured with. Each replica puts
# 0.0.0.0 in its own slot, so it does not have to bind a ClusterIP that is not local.
#
# IF A CLUSTERIP IS TAKEN when re-applying elsewhere, the Service is rejected; pick three free ones and update
# TB_IP_0..2 here AND TB_ADDRESSES on the tb-adapter sidecar in ledger-bridge-deployment.yaml.
#
# NOT A DROP-IN FOR THE SHARED ONE: it is a NEW cluster (new id, empty). Nothing was migrated: the shared
# cluster held only QA smoke-test accounts.
---
apiVersion: v1
kind: Service
metadata:
  name: wa-tigerbeetle-headless
  namespace: whatsapp-commerce
  labels: {app.kubernetes.io/name: wa-tigerbeetle}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: wa-tigerbeetle}
  ports: [{name: tb, port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: wa-tb-0
  namespace: whatsapp-commerce
  labels: {app.kubernetes.io/name: wa-tigerbeetle}
spec:
  clusterIP: 10.96.240.10
  selector: {statefulset.kubernetes.io/pod-name: wa-tigerbeetle-0}
  publishNotReadyAddresses: true # peers must be able to connect to a replica that is still starting
  ports: [{name: tb, port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: wa-tb-1
  namespace: whatsapp-commerce
  labels: {app.kubernetes.io/name: wa-tigerbeetle}
spec:
  clusterIP: 10.96.240.11
  selector: {statefulset.kubernetes.io/pod-name: wa-tigerbeetle-1}
  publishNotReadyAddresses: true
  ports: [{name: tb, port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: wa-tb-2
  namespace: whatsapp-commerce
  labels: {app.kubernetes.io/name: wa-tigerbeetle}
spec:
  clusterIP: 10.96.240.12
  selector: {statefulset.kubernetes.io/pod-name: wa-tigerbeetle-2}
  publishNotReadyAddresses: true
  ports: [{name: tb, port: 3000, targetPort: 3000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wa-tigerbeetle
  namespace: whatsapp-commerce
spec:
  maxUnavailable: 1 # a drain may take ONE replica; two down means no quorum
  selector:
    matchLabels: {app.kubernetes.io/name: wa-tigerbeetle}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wa-tigerbeetle
  namespace: whatsapp-commerce
  labels: {app.kubernetes.io/name: wa-tigerbeetle}
spec:
  serviceName: wa-tigerbeetle-headless
  replicas: 3
  podManagementPolicy: Parallel # replicas wait for each other's sockets, so they must be able to start together
  selector:
    matchLabels: {app.kubernetes.io/name: wa-tigerbeetle}
  template:
    metadata:
      labels: {app.kubernetes.io/name: wa-tigerbeetle}
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: wa-tigerbeetle}
              topologyKey: kubernetes.io/hostname # one replica per node, so one node lost is one replica lost
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule # there are only two workers; the third replica needs the control-plane node
      securityContext:
        fsGroup: 65532
      containers:
        - name: tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:0.16.66
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ORD="${HOSTNAME##*-}"
              FILE=/var/lib/tb/data.tigerbeetle
              if [ ! -f "$FILE" ]; then
                # Format to a temp name and rename, so a crash mid-format cannot leave a half-formatted
                # file that "exists" and then fails to start forever.
                rm -f "$FILE.tmp"
                /tigerbeetle format --cluster="$CLUSTER_ID" --replica="$ORD" --replica-count=3 "$FILE.tmp"
                mv "$FILE.tmp" "$FILE"
              fi
              ADDRS=""
              for j in 0 1 2; do
                a="$(eval echo "\$TB_IP_$j"):3000"
                [ "$j" = "$ORD" ] && a="0.0.0.0:3000"
                ADDRS="${ADDRS:+$ADDRS,}$a"
              done
              echo "replica $ORD of cluster $CLUSTER_ID, addresses $ADDRS"
              exec /tigerbeetle start --addresses="$ADDRS" --cache-grid=128MiB "$FILE"
          env:
            - {name: CLUSTER_ID, value: "160071330234540767289684610414810526351"}
            - {name: TB_IP_0, value: 10.96.240.10}
            - {name: TB_IP_1, value: 10.96.240.11}
            - {name: TB_IP_2, value: 10.96.240.12}
          ports:
            - {name: tb, containerPort: 3000}
          # TigerBeetle has no HTTP endpoint; a TCP check on its port is the honest liveness signal. (Each
          # probe shows up in its log as an "orderly shutdown" of an unknown peer — that is normal.)
          livenessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            # TigerBeetle uses io_uring, which the runtime-default seccomp profile blocks. Explicit so that
            # cluster-wide RuntimeDefault later fails loudly here instead of crash-looping.
            seccompProfile: {type: Unconfined}
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: "1", memory: 3Gi, ephemeral-storage: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/tb}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 3Gi # the data file is a fixed ~1.06 GiB
