apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ml-stack
    app.kubernetes.io/name: ml-stack
  name: ml-stack
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-stack
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-08-11T17:02:29+01:00"
      labels:
        app.kubernetes.io/name: ml-stack
    spec:
      containers:
      - env:
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-ml-stack:20260918-1642 # {"$imagepolicy": "flux-system:whatsapp-ml-stack"}
        imagePullPolicy: Always
        name: ml-stack
        ports:
        - containerPort: 8099
          name: port-8099
          protocol: TCP
        # QA-013: sibling of QA-012 — this deployment had no probes at
        # all either. Uses the service's existing /health endpoint (already
        # exercised by tests/e2e/smoke.test.ts against the real service).
        readinessProbe:
          httpGet:
            path: /health
            port: 8099
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8099
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
