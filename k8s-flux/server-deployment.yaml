apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: server
    app.kubernetes.io/name: server
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: server-0.1.0
  name: server
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  # NO `replicas:` HERE ON PURPOSE (QA-041). The HorizontalPodAutoscaler (server-hpa.yaml, min 2 / max 4) owns the
  # replica count; a `replicas:` field in this file would be re-applied by Flux on every reconcile and fight the HPA,
  # scaling the Deployment back down mid-burst. The FLOOR of 2 lives in the HPA's minReplicas, and is what the
  # availability test pins. (2 replicas: a restart, OOM-kill or node drain is not a full outage. Proven multi-replica-safe:
  # chaos CX-01 (abrupt loss of one of two replicas, 899/899 OK), signed-cookie PKCE (QA-018), Redis-backed limits.)
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: server
      app.kubernetes.io/name: server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never below the desired count during a rollout
    type: RollingUpdate
  template:
    metadata:
      annotations:
        dapr.io/app-id: wacommerce-server
        dapr.io/app-port: "3000"
        dapr.io/enabled: "true"
        kubectl.kubernetes.io/restartedAt: "2026-08-10T16:28:51+01:00"
      labels:
        app.kubernetes.io/instance: server
        app.kubernetes.io/name: server
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: server-0.1.0
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: whatsapp-postgres-dsn
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              key: REDIS_URL
              name: whatsapp-redis-url
        - name: KAFKA_BROKERS
          value: mojaloop-kafka-cluster-kafka-bootstrap.kafka.svc:9092
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: whatsapp-server-jwt-secret
        - name: KEYCLOAK_URL
          value: https://keycloak-servers.newfire.app
        - name: APP_URL
          value: https://wa-app.newfire.app
        - name: SECRETS_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: SECRETS_MASTER_KEY
              name: whatsapp-server-secrets-master-key
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: value
              name: whatsapp-server-keycloak-client-secret
        - name: WHATSAPP_VERIFY_TOKEN
          valueFrom:
            secretKeyRef:
              key: value
              name: whatsapp-server-verify-token
        - name: WHATSAPP_APP_SECRET
          valueFrom:
            secretKeyRef:
              key: value
              name: whatsapp-server-app-secret
        - name: WHATSAPP_DEFAULT_TENANT_ID
          value: 3ad325ad-d0f3-4193-b7f0-d03002cfa451
        - name: OPENSEARCH_URL
          value: http://shared-cluster-master.opensearch.svc.cluster.local:9200
        - name: OPENSEARCH_USER
          value: admin
        - name: APISIX_ADMIN_URL
          value: http://appsec-apisix-dev-admin.appsec-apisix-dev.svc.cluster.local:9180
        - name: OPENSEARCH_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: whatsapp-server-opensearch
        - name: APISIX_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              key: value
              name: whatsapp-server-apisix-admin-key
        - name: MOJALOOP_URL
          value: http://mojaloop-centralledger-service.mojaloop.svc.cluster.local:80
        - name: RECON_WORKER_URL
          value: http://recon-worker.whatsapp-commerce.svc.cluster.local:8096
        - name: ML_STACK_URL
          value: http://ml-stack.whatsapp-commerce.svc.cluster.local:8099
        - name: KYC_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              key: KYC_SERVICE_API_KEY
              name: whatsapp-server-kyc-api-key
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              key: RESEND_API_KEY
              name: whatsapp-server-resend-api-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: S3_SECRET_KEY
              name: whatsapp-server-minio
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: S3_ACCESS_KEY
              name: whatsapp-server-minio
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              key: S3_BUCKET
              name: whatsapp-server-minio
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: S3_ENDPOINT
              name: whatsapp-server-minio
        - name: PAYSTACK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: PAYSTACK_SECRET_KEY
              name: whatsapp-server-paystack
        - name: PAYSTACK_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: PAYSTACK_WEBHOOK_SECRET
              name: whatsapp-server-paystack
        - name: PAYSTACK_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: PAYSTACK_PUBLIC_KEY
              name: whatsapp-server-paystack
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              key: INTERNAL_API_KEY
              name: whatsapp-server-internal-api-key
        - name: USSD_GATEWAY_SECRET
          valueFrom:
            secretKeyRef:
              key: USSD_GATEWAY_SECRET
              name: whatsapp-server-ussd-gateway-secret
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        - name: OTEL_COLLECTOR_URL
          value: http://otel-collector.otel.svc.cluster.local:13133
        - name: METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              key: value
              name: whatsapp-server-metrics-token
        - name: JAEGER_URL
          value: http://jaeger.otel.svc.cluster.local:16686
        - name: PROMETHEUS_URL
          value: http://prometheus.otel.svc.cluster.local:9090
        - name: GRAFANA_URL
          value: http://grafana.otel.svc.cluster.local:3000
        - name: ALERTMANAGER_URL
          value: http://alertmanager.otel.svc.cluster.local:9093
        - name: PERMIFY_URL
          value: http://permify.permify.svc.cluster.local:3476
        image: registry.digitalocean.com/talentgraph-auth/whatsapp-server:20260922-0929 # {"$imagepolicy": "flux-system:whatsapp-server"}
        imagePullPolicy: Always
        name: server
        ports:
        - containerPort: 3000
          name: port-3000
          protocol: TCP
        # QA-012: this deployment had no probes at all — confirmed via live
        # chaos/rolling-restart testing that Kubernetes was routing traffic to
        # pods before the app had finished booting or connecting to its
        # dependencies. Both endpoints are unauthenticated and purpose-built
        # for this (server/_core/index.ts:5347,5356). Liveness stays shallow
        # (process alive) so a transient downstream outage — e.g. Keycloak —
        # triggers graceful 503s via readiness, not a restart-loop of an
        # otherwise-healthy process.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        # QA-027: the old 512Mi limit was BELOW the 613-800 MiB the server measured under load (it would be
        # OOM-killed exactly when busiest) and the 64Mi request let the scheduler stack it on any node.
        # The requests stay modest on purpose: the workers' CPU requests are already ~98% allocated.
        #
        # QA-041/042: the CPU request is 100m, NOT 200m, for a scheduling reason that cost us a rollout. The tighter worker
        # had ~145-345m of CPU requests free, and while a rolling update is in flight the old pod still holds its request:
        # a 200m pod did not FIT on that worker, so the scheduler had no choice and put BOTH replicas on the other one
        # (measured after the qa-local8 rollout; scripts/qa-local-ship.sh check-spread caught it). Actual use is 8-36m per
        # pod (metrics-server), so 100m is still several times what it needs. The HPA scales on an absolute 600m average,
        # not on a percentage of this request, so it is unaffected.
        resources:
          limits:
            cpu: "1"
            ephemeral-storage: 256Mi
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 384Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      # Spread the replicas over nodes (soft: a one-node cluster must still schedule both).
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: server
            app.kubernetes.io/name: server
        # QA-042: count only pods of the SAME REVISION. The selector above matches every revision, so during a rolling update
        # the still-running OLD pods (one per node) bias the count, the second new pod sees a tie between nodes, and picks by
        # chance — measured: after two consecutive rollouts of `server` both replicas landed on ONE node (first worker, then
        # the other), a single-node-loss outage that looked healthy. `pod-template-hash` makes the new pods spread among
        # themselves. (Soft on purpose: a one-node cluster must still schedule both.)
        matchLabelKeys:
        - pod-template-hash
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
