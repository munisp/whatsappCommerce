apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: event-processor
    app.kubernetes.io/name: event-processor
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: event-processor-0.1.0
  name: event-processor
  namespace: whatsapp-commerce
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: event-processor
      app.kubernetes.io/name: event-processor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: event-processor
        app.kubernetes.io/name: event-processor
        app.kubernetes.io/version: 0.0.1
        helm.sh/chart: event-processor-0.1.0
    spec:
      containers:
      - env:
        - name: KAFKA_BROKERS
          value: mojaloop-kafka-cluster-kafka-bootstrap.kafka.svc:9092
        - name: CONVERSATION_ORCHESTRATOR_URL
          value: http://conversation-orchestrator.whatsapp-commerce.svc.cluster.local:8082
        - name: COMMERCE_ENGINE_URL
          value: http://commerce-engine.whatsapp-commerce.svc.cluster.local:8083
        - name: PAYMENT_ORCHESTRATOR_URL
          value: http://payment-orchestrator.whatsapp-commerce.svc.cluster.local:8084
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel.svc.cluster.local:4318
        image: 20260831-1409 # {"$imagepolicy": "flux-system:whatsapp-event-processor:tag"}
        imagePullPolicy: IfNotPresent
        name: event-processor
        ports:
        - containerPort: 8091
          name: port-8091
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
