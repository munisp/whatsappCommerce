apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: whatsapp-commerce
  labels:
    app: platform
    version: v1
spec:
  # Baseline replicas; the HPA below scales this 2 -> 20 under load.
  replicas: 2
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: platform
          image: whatsapp-commerce/platform:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # 2GB V8 old-space cap per replica — see docs/PERF.md (heap experiment).
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2048"
            # Per-replica PG pool size. 20 replicas x 10 conns = 200 max
            # connections, well under a 300-conn Postgres budget.
            - name: PG_POOL_MAX
              value: "10"
            - name: LOG_LEVEL
              value: info
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  namespace: whatsapp-commerce
  labels:
    app: platform
spec:
  selector:
    app: platform
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform
  namespace: whatsapp-commerce
  labels:
    app: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform
  # Scale 2 -> 20 replicas; see docs/PERF.md (100k scaling path).
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
