---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: whatsapp-commerce
  labels: {app: ai-agent}
spec:
  selector: {app: ai-agent}
  ports:
    - {name: http, port: 8090, targetPort: http}
# === END W54 CILIUM ===
