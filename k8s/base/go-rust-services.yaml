# === W54 CILIUM ===
# Go/Rust service tier modeled from docker-compose.yml: conversation-orchestrator,
# commerce-engine, payment-orchestrator (money rails), ledger-bridge, hermes-bridge.
# All reach only their brokers/DB per compose depends_on — enforced by Cilium.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-orchestrator
  namespace: whatsapp-commerce
  labels: {app: conversation-orchestrator, app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app: conversation-orchestrator}
  template:
    metadata:
      labels: {app: conversation-orchestrator, app.kubernetes.io/part-of: whatsapp-commerce-platform}
    spec:
      containers:
        - name: conversation-orchestrator
          image: REPLACE_WITH_REGISTRY/conversation-orchestrator:latest
          env:
            - {name: PORT, value: "8082"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: platform-db, key: database-url}
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
            - {name: REDIS_URL, value: "redis://redis:6379"}
            - {name: AI_AGENT_URL, value: "http://ai-agent:8090"}
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: {name: platform-app, key: internal-api-key}
            - {name: LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8082}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: conversation-orchestrator
  namespace: whatsapp-commerce
  labels: {app: conversation-orchestrator}
spec:
  selector: {app: conversation-orchestrator}
  ports:
    - {name: http, port: 8082, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-engine
  namespace: whatsapp-commerce
  labels: {app: commerce-engine, app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app: commerce-engine}
  template:
    metadata:
      labels: {app: commerce-engine, app.kubernetes.io/part-of: whatsapp-commerce-platform}
    spec:
      containers:
        - name: commerce-engine
          image: REPLACE_WITH_REGISTRY/commerce-engine:latest
          env:
            - {name: PORT, value: "8083"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: platform-db, key: database-url}
            - {name: REDIS_URL, value: "redis://redis:6379"}
            - {name: TEMPORAL_ADDRESS, value: "temporal:7233"}
            - {name: TEMPORAL_NAMESPACE, value: default}
            - {name: TEMPORAL_TASK_QUEUE, value: whatsapp-commerce}
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: {name: platform-app, key: internal-api-key}
            - {name: LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8083}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-engine
  namespace: whatsapp-commerce
  labels: {app: commerce-engine}
spec:
  selector: {app: commerce-engine}
  ports:
    - {name: http, port: 8083, targetPort: http}
---
# MONEY RAILS: payment-orchestrator — most locked-down workload in the mesh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-orchestrator
  namespace: whatsapp-commerce
  labels: {app: payment-orchestrator, tier: money-rails, app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-orchestrator}
  template:
    metadata:
      labels: {app: payment-orchestrator, tier: money-rails, app.kubernetes.io/part-of: whatsapp-commerce-platform}
    spec:
      containers:
        - name: payment-orchestrator
          image: REPLACE_WITH_REGISTRY/payment-orchestrator:latest
          env:
            - {name: PORT, value: "8084"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: platform-db, key: database-url}
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
            - {name: REDIS_URL, value: "redis://redis:6379"}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: platform-app, key: stripe-secret-key}
            - {name: MOJALOOP_API_URL, value: "http://mojaloop-simulator:3000"}
            - {name: TIGERBEETLE_URL, value: "tigerbeetle:3000"}
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: {name: platform-app, key: internal-api-key}
            - name: PAYMENT_ORCHESTRATOR_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: {name: platform-app, key: payment-orchestrator-internal-token}
            - name: PLATFORM_ESCROW_ACCOUNT_ID
              valueFrom:
                secretKeyRef: {name: platform-app, key: platform-escrow-account-id}
            - {name: LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8084}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-orchestrator
  namespace: whatsapp-commerce
  labels: {app: payment-orchestrator}
spec:
  selector: {app: payment-orchestrator}
  ports:
    - {name: http, port: 8084, targetPort: http}
---
# MONEY RAILS: ledger-bridge (Rust, TigerBeetle gateway, port 8095)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-bridge
  namespace: whatsapp-commerce
  labels: {app: ledger-bridge, tier: money-rails, app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger-bridge}
  template:
    metadata:
      labels: {app: ledger-bridge, tier: money-rails, app.kubernetes.io/part-of: whatsapp-commerce-platform}
    spec:
      containers:
        - name: ledger-bridge
          image: REPLACE_WITH_REGISTRY/ledger-bridge:latest
          env:
            - {name: PORT, value: "8095"}
            - {name: TIGERBEETLE_ADDRESS, value: "tigerbeetle:3000"}
            - {name: TIGERBEETLE_CLUSTER_ID, value: "0"}
            - name: PLATFORM_ESCROW_ACCOUNT_ID
              valueFrom:
                secretKeyRef: {name: platform-app, key: platform-escrow-account-id}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: platform-db, key: database-url}
            - {name: RUST_LOG, value: info}
          ports:
            - {name: http, containerPort: 8095}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-bridge
  namespace: whatsapp-commerce
  labels: {app: ledger-bridge}
spec:
  selector: {app: ledger-bridge}
  ports:
    - {name: http, port: 8095, targetPort: http}
---
# Hermes bridge (Go, Kafka consumer → Hermes Cloud forwarder, port 8096)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-bridge
  namespace: whatsapp-commerce
  labels: {app: hermes-bridge, app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hermes-bridge}
  template:
    metadata:
      labels: {app: hermes-bridge, app.kubernetes.io/part-of: whatsapp-commerce-platform}
    spec:
      containers:
        - name: hermes-bridge
          image: REPLACE_WITH_REGISTRY/hermes-bridge:latest
          env:
            - {name: PORT, value: "8096"}
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
            - {name: REDIS_URL, value: "redis://redis:6379"}
            - {name: REDIS_DURABLE_URL, value: "redis://redis-durable:6379"}
            - {name: HERMES_AGENT_URL, value: "https://api.hermes-agent.com"}
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef: {name: platform-app, key: hermes-api-key}
            - {name: PLATFORM_API_URL, value: "http://platform:3000"}
            - name: PLATFORM_HMAC_SECRET
              valueFrom:
                secretKeyRef: {name: platform-app, key: platform-hmac-secret}
            - {name: HERMES_SKILLS_URL, value: "http://hermes-skills:8097"}
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: {name: platform-app, key: internal-api-key}
            - {name: HERMES_CALLBACK_BASE_URL, value: "https://REPLACE_WITH_PUBLIC_HOST"}
            - {name: WA_PO_APPROVAL_TEMPLATE, value: po_approval_request}
            - {name: LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8096}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-bridge
  namespace: whatsapp-commerce
  labels: {app: hermes-bridge}
spec:
  selector: {app: hermes-bridge}
  ports:
    - {name: http, port: 8096, targetPort: http}
# === END W54 CILIUM ===
