# === W54 CILIUM ===
# Redis instances modeled from docker-compose.yml:
#   redis          — CACHE/ephemeral only (volatile-lru; only TTL keys evicted)
#   redis-durable  — PERF-SC-16 noeviction instance for idempotency keys
#                    (ns:idem:*), hermes approvals, DLQ lists, liveness sessions.
#                    Eviction here breaks exactly-once/approval guarantees.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: whatsapp-commerce
  labels: {app: redis, app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: whatsapp-commerce-platform}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: whatsapp-commerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: whatsapp-commerce
  labels: {app: redis}
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-durable
  namespace: whatsapp-commerce
  labels: {app: redis-durable, app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis-durable}
  template:
    metadata:
      labels: {app: redis-durable, app.kubernetes.io/part-of: whatsapp-commerce-platform}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-durable-data}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-durable-data
  namespace: whatsapp-commerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-durable
  namespace: whatsapp-commerce
  labels: {app: redis-durable}
spec:
  selector: {app: redis-durable}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
# === END W54 CILIUM ===
