# === W54 CILIUM ===
# Secrets pattern: ExternalSecrets (external-secrets.io). Real secret values
# live in an external store (Vault / AWS SM / GCP SM) — NOTHING secret is
# committed here. Apply the ClusterSecretStore for your backend first, then
# these ExternalSecrets materialize the K8s Secrets referenced by the
# Deployments (platform-db, platform-app).
#
# Bitnami SealedSecrets is an acceptable alternative: `kubeseal` the Secret
# and commit the *sealed* output instead of these manifests.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-db
  namespace: whatsapp-commerce
  labels: {app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_CLUSTER_SECRET_STORE # e.g. vault-backend
    kind: ClusterSecretStore
  target:
    name: platform-db
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef: {key: whatsapp-commerce/db, property: postgres_password}
    - secretKey: temporal-db-password
      remoteRef: {key: whatsapp-commerce/db, property: temporal_db_password}
    - secretKey: database-url
      remoteRef: {key: whatsapp-commerce/db, property: database_url}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-app
  namespace: whatsapp-commerce
  labels: {app.kubernetes.io/part-of: whatsapp-commerce-platform}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_CLUSTER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: platform-app
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef: {key: whatsapp-commerce/app, property: jwt_secret}
    - secretKey: secrets-master-key
      remoteRef: {key: whatsapp-commerce/app, property: secrets_master_key}
    - secretKey: whatsapp-verify-token
      remoteRef: {key: whatsapp-commerce/app, property: whatsapp_verify_token}
    - secretKey: internal-api-key
      remoteRef: {key: whatsapp-commerce/app, property: internal_api_key}
    - secretKey: cron-jwt
      remoteRef: {key: whatsapp-commerce/app, property: cron_jwt}
    - secretKey: kyc-service-api-key
      remoteRef: {key: whatsapp-commerce/app, property: kyc_service_api_key}
    - secretKey: stripe-secret-key
      remoteRef: {key: whatsapp-commerce/app, property: stripe_secret_key}
    - secretKey: payment-orchestrator-internal-token
      remoteRef: {key: whatsapp-commerce/app, property: payment_orchestrator_internal_token}
    - secretKey: platform-escrow-account-id
      remoteRef: {key: whatsapp-commerce/app, property: platform_escrow_account_id}
    - secretKey: openai-api-key
      remoteRef: {key: whatsapp-commerce/app, property: openai_api_key}
    - secretKey: anthropic-api-key
      remoteRef: {key: whatsapp-commerce/app, property: anthropic_api_key}
    - secretKey: hermes-api-key
      remoteRef: {key: whatsapp-commerce/app, property: hermes_api_key}
    - secretKey: platform-hmac-secret
      remoteRef: {key: whatsapp-commerce/app, property: platform_hmac_secret}
# === END W54 CILIUM ===
