apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference
  namespace: whatsapp-commerce
  labels:
    app: ml-inference
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
        version: v1
    spec:
      containers:
        - name: ml-inference
          image: whatsapp-commerce/ml-inference:latest
          ports:
            - containerPort: 8099
          env:
            - name: PORT
              value: "8099"
            - name: MODEL_DIR
              value: /app/models
            - name: LOG_LEVEL
              value: info
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 40
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference
  namespace: whatsapp-commerce
spec:
  selector:
    app: ml-inference
  ports:
    - port: 8099
      targetPort: 8099
