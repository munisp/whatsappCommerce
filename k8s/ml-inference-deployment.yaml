apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference
  namespace: whatsapp-commerce
  labels:
    app: ml-inference
    app.kubernetes.io/name: ml-inference
    app.kubernetes.io/part-of: whatsapp-commerce-platform
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
        app.kubernetes.io/name: ml-inference
        app.kubernetes.io/part-of: whatsapp-commerce-platform
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml-inference
          # Built from services/ml-stack/Dockerfile (the "ml-stack" service).
          image: whatsapp-commerce/ml-inference:v1.0.0
          ports:
            - containerPort: 8099
          env:
            - name: PORT
              value: "8099"
            - name: MODEL_DIR
              value: /app/models
            - name: LOG_LEVEL
              value: info
            # Python/HF cache writes go to the writable emptyDir (read-only rootfs).
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Probe path verified: GET /health — services/ml-stack/inference/server.py:320.
          readinessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 40
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference
  namespace: whatsapp-commerce
  labels:
    app: ml-inference
    app.kubernetes.io/part-of: whatsapp-commerce-platform
spec:
  selector:
    app: ml-inference
  ports:
    - port: 8099
      targetPort: 8099
  type: ClusterIP
