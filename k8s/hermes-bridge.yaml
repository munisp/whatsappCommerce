# W30 (V3#4) — hermes-bridge Deployment + Service so the platform's
# HERMES_BRIDGE_URL (k8s/configmap.yaml) resolves inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-bridge
  namespace: whatsapp-commerce
  labels:
    app.kubernetes.io/name: hermes-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-bridge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: hermes-bridge
          image: whatsapp-commerce/hermes-bridge:latest
          ports:
            - containerPort: 8096
          env:
            - name: PORT
              value: "8096"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_BROKERS
            - name: HERMES_SKILLS_URL
              value: "http://hermes-skills.whatsapp-commerce.svc.cluster.local:8097"
            - name: HERMES_AGENT_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: HERMES_AGENT_URL
                  optional: true
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: HERMES_API_KEY
                  optional: true
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-bridge
  namespace: whatsapp-commerce
  labels:
    app.kubernetes.io/name: hermes-bridge
spec:
  selector:
    app.kubernetes.io/name: hermes-bridge
  ports:
    - name: http
      port: 8096
      targetPort: 8096
