# Twice-daily cluster health report, emailed via the same Resend pipeline
# wired up for Alertmanager (otel-alert-smtp secret in this namespace -
# reuses its `password` key directly as a Resend API key, since Resend's
# REST API is simpler to call from a shell script than implementing SMTP).
#
# A real Kubernetes CronJob, not a session-bound Claude Code cron job -
# this needs to keep running whether or not any Claude session is open.
#
# Schedule is UTC (Kubernetes CronJob default) - 7am and 7pm. Adjust the
# `schedule` fields (or add `timeZone:`, supported on this cluster's k8s
# 1.34) if a different time/timezone is wanted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-report
  namespace: otel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-report
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-report
subjects:
  - kind: ServiceAccount
    name: cluster-report
    namespace: otel
roleRef:
  kind: ClusterRole
  name: cluster-report
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-report-script
  namespace: otel
data:
  report.sh: |
    #!/bin/sh
    set -eu

    REPORT_LABEL="${1:-Cluster Report}"

    NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
    NODE_NOTREADY=$(kubectl get nodes --no-headers | grep -v " Ready " || true)
    NODE_NOTREADY_COUNT=$(echo "$NODE_NOTREADY" | grep -c . || true)
    NODE_READY_COUNT=$((NODE_COUNT - NODE_NOTREADY_COUNT))

    # Pods not in a healthy terminal/running state, across every namespace.
    BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null \
      | awk '$4 !~ /^Running$|^Completed$/ {print}' || true)
    BAD_POD_COUNT=$(echo "$BAD_PODS" | grep -c . || true)

    # Restart-heavy pods (>5 restarts) - a crash-looping pod that's since
    # stabilized still shows Running, so this catches what the status
    # column alone would hide.
    HIGH_RESTARTS=$(kubectl get pods -A --no-headers 2>/dev/null \
      | awk '{restarts=$5; gsub(/[^0-9].*/,"",restarts); if (restarts+0 > 5) print}' || true)

    # Fleet-wide Prometheus up{} check - the same job list the Newwave
    # Shared Infra Fleet Grafana dashboard uses.
    FLEET_JOBS="pg-oracle|pg-54agent|pg-54link-dev|pg-ucard|pg-ndsep|pg-vpp|pg-meridian|keycloak-postgres|permify-postgres|farmer-data-collection-postgres|gds-postgres|insurance-demo-postgres|lanai-postgres|nsep-demo-postgres|paymenthub-postgres|tourismpay-postgres|fineract-postgres|redis|mojaloop-auth-svc-redis|mojaloop-proxy-cache-redis|mojaloop-ttksims-redis|insurance-demo-redis|novu-redis|mongodb|ttk-mongodb|novu-mongodb|mysql|kafka|qdrant|minio|temporal-elasticsearch|etcd|dapr-placement-server|dapr-scheduler-server"
    FLEET_JSON=$(curl -s --max-time 15 -G "http://prometheus.otel.svc.cluster.local:9090/api/v1/query" \
      --data-urlencode "query=up{job=~\"$FLEET_JOBS\"}" || echo '{}')
    FLEET_DOWN=$(echo "$FLEET_JSON" | jq -r '[.data.result[] | select(.value[1]=="0") | .metric.job] | join(", ")' 2>/dev/null || echo "(query failed)")
    FLEET_DOWN_COUNT=$(echo "$FLEET_JSON" | jq -r '[.data.result[] | select(.value[1]=="0")] | length' 2>/dev/null || echo "?")
    FLEET_TOTAL=$(echo "$FLEET_JSON" | jq -r '.data.result | length' 2>/dev/null || echo "?")

    # Currently firing Alertmanager alerts.
    ALERTS_JSON=$(curl -s --max-time 15 "http://alertmanager.otel.svc.cluster.local:9093/api/v2/alerts?active=true" || echo '[]')
    ALERTS_SUMMARY=$(echo "$ALERTS_JSON" | jq -r '.[] | "  - " + .labels.alertname + " (" + .labels.severity + "): " + (.annotations.summary // "no summary")' 2>/dev/null || echo "")
    ALERTS_COUNT=$(echo "$ALERTS_JSON" | jq -r 'length' 2>/dev/null || echo "?")

    # Numeric-sanitize for the arithmetic/comparisons below - a query failure
    # above falls back to "?" (visible to a human in the text body), which
    # would otherwise blow up `$(( ))` under `set -eu` and abort before the
    # email ever sends.
    case "$BAD_POD_COUNT" in ''|*[!0-9]*) BAD_POD_COUNT=0 ;; esac
    case "$FLEET_DOWN_COUNT" in ''|*[!0-9]*) FLEET_DOWN_COUNT=0 ;; esac
    case "$FLEET_TOTAL" in ''|*[!0-9]*) FLEET_TOTAL=0 ;; esac
    case "$ALERTS_COUNT" in ''|*[!0-9]*) ALERTS_COUNT=0 ;; esac

    BODY=$(cat <<EOF
    ${REPORT_LABEL} - kind-newwave-dev

    NODES: ${NODE_COUNT} total
    $( [ -n "$NODE_NOTREADY" ] && echo "  NOT READY:" && echo "$NODE_NOTREADY" | sed 's/^/  - /' || echo "  all Ready" )

    PODS: ${BAD_POD_COUNT} not Running/Completed across the cluster
    $( [ -n "$BAD_PODS" ] && echo "$BAD_PODS" | awk '{print "  - "$1"/"$2" ("$4")"}' | head -20 )

    RESTART-HEAVY PODS (>5 restarts):
    $( [ -n "$HIGH_RESTARTS" ] && echo "$HIGH_RESTARTS" | awk '{print "  - "$1"/"$2" (restarts: "$5")"}' | head -20 || echo "  none" )

    SHARED INFRA FLEET: ${FLEET_DOWN_COUNT}/${FLEET_TOTAL} scrape targets down
    $( [ "$FLEET_DOWN_COUNT" != "0" ] && [ -n "$FLEET_DOWN" ] && echo "  DOWN: ${FLEET_DOWN}" || echo "  all up" )

    FIRING ALERTS: ${ALERTS_COUNT}
    ${ALERTS_SUMMARY}

    Full dashboard: https://grafana.newfire.app/d/newwave-fleet/
    EOF
    )

    echo "$BODY"

    # HTML escaping for free-text fields (alert summaries are human-written
    # annotations and could contain &, <, > - pod/node/namespace names can't,
    # they're DNS-1123 safe, but we escape everything routed through here
    # uniformly rather than special-casing).
    esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

    REPORT_DATE=$(date -u +"%A, %d %B %Y %H:%M UTC")
    ISSUE_COUNT=$((BAD_POD_COUNT + FLEET_DOWN_COUNT + ALERTS_COUNT))
    if [ "$ISSUE_COUNT" -eq 0 ]; then
      STATUS_COLOR="#16a34a"; STATUS_BG="#f0fdf4"; STATUS_TEXT="All Systems Operational"
    elif [ "$ALERTS_COUNT" -gt 0 ] || [ "$FLEET_DOWN_COUNT" -gt 0 ]; then
      STATUS_COLOR="#dc2626"; STATUS_BG="#fef2f2"; STATUS_TEXT="${ISSUE_COUNT} Issue(s) Require Attention"
    else
      STATUS_COLOR="#d97706"; STATUS_BG="#fffbeb"; STATUS_TEXT="${ISSUE_COUNT} Item(s) Flagged"
    fi

    tile() {
      # tile LABEL VALUE COLOR
      printf '<td style="padding:0 6px;" width="25%%"><div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px 8px;text-align:center;"><div style="font-size:24px;font-weight:700;color:%s;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;">%s</div><div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-top:4px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;">%s</div></div></td>' "$3" "$2" "$1"
    }
    NODE_COLOR="#16a34a"; [ -n "$NODE_NOTREADY" ] && NODE_COLOR="#dc2626"
    POD_COLOR="#16a34a"; [ "$BAD_POD_COUNT" -gt 0 ] && POD_COLOR="#d97706"
    FLEET_COLOR="#16a34a"; [ "$FLEET_DOWN_COUNT" -gt 0 ] && FLEET_COLOR="#dc2626"
    ALERT_COLOR="#16a34a"; [ "$ALERTS_COUNT" -gt 0 ] && ALERT_COLOR="#dc2626"
    TILES_HTML=$(printf '%s%s%s%s' \
      "$(tile "Nodes Ready" "${NODE_READY_COUNT}/${NODE_COUNT}" "$NODE_COLOR")" \
      "$(tile "Unhealthy Pods" "$BAD_POD_COUNT" "$POD_COLOR")" \
      "$(tile "Fleet Targets Down" "${FLEET_DOWN_COUNT}/${FLEET_TOTAL}" "$FLEET_COLOR")" \
      "$(tile "Firing Alerts" "$ALERTS_COUNT" "$ALERT_COLOR")")

    section_row() {
      # section_row TEXT  ->  one <div> row styled as a list item
      printf '<div style="padding:10px 14px;border-bottom:1px solid #f1f5f9;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;color:#334155;">%s</div>' "$1"
    }

    NODE_SECTION=""
    if [ -n "$NODE_NOTREADY" ]; then
      NODE_SECTION=$(echo "$NODE_NOTREADY" | esc | awk '{print "&#8226; " $0}' | while IFS= read -r l; do section_row "$l"; done)
    fi

    POD_SECTION=""
    if [ -n "$BAD_PODS" ]; then
      POD_SECTION=$(echo "$BAD_PODS" | esc | awk '{print "<strong>"$1"/"$2"</strong> &mdash; "$4}' | head -20 | while IFS= read -r l; do section_row "$l"; done)
    fi

    RESTART_SECTION=""
    if [ -n "$HIGH_RESTARTS" ]; then
      RESTART_SECTION=$(echo "$HIGH_RESTARTS" | esc | awk '{print "<strong>"$1"/"$2"</strong> &mdash; "$5" restarts"}' | head -20 | while IFS= read -r l; do section_row "$l"; done)
    fi

    ALERT_SECTION=""
    if [ "$ALERTS_COUNT" -gt 0 ]; then
      ALERT_SECTION=$(echo "$ALERTS_JSON" | jq -r '.[] | .labels.alertname + " :: " + .labels.severity + " :: " + (.annotations.summary // "no summary")' 2>/dev/null \
        | esc | awk -F' :: ' '{print "<strong style=\"color:#dc2626;\">"$1"</strong> ("$2") &mdash; "$3}' | while IFS= read -r l; do section_row "$l"; done)
    fi

    FLEET_SECTION=""
    if [ "$FLEET_DOWN_COUNT" != "0" ] && [ -n "$FLEET_DOWN" ]; then
      FLEET_SECTION=$(section_row "$(echo "$FLEET_DOWN" | esc)")
    fi

    card() {
      # card TITLE BADGE_COLOR BODY_HTML  ->  skipped entirely if BODY_HTML empty
      [ -z "$3" ] && return
      printf '<tr><td style="padding:20px 24px 0 24px;"><table role="presentation" width="100%%" cellpadding="0" cellspacing="0" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;"><tr><td style="background:#f8fafc;padding:10px 14px;border-bottom:1px solid #e2e8f0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;color:#1e293b;text-transform:uppercase;letter-spacing:.03em;border-left:3px solid %s;">%s</td></tr><tr><td>%s</td></tr></table></td></tr>' "$2" "$1" "$3"
    }

    CARDS_HTML=$(printf '%s%s%s%s%s' \
      "$(card "Nodes Not Ready" "#dc2626" "$NODE_SECTION")" \
      "$(card "Firing Alerts" "#dc2626" "$ALERT_SECTION")" \
      "$(card "Shared Infra Fleet &mdash; Targets Down" "#dc2626" "$FLEET_SECTION")" \
      "$(card "Unhealthy Pods" "#d97706" "$POD_SECTION")" \
      "$(card "Restart-Heavy Pods (&gt;5 restarts)" "#64748b" "$RESTART_SECTION")")

    HTML=$(cat <<HTMLEOF
    <!doctype html>
    <html><body style="margin:0;padding:0;background:#eef2f6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f6;padding:24px 0;">
    <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;">
      <tr><td style="background:#0f172a;padding:24px 24px 20px 24px;">
        <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;font-weight:600;">Newwave Platform &middot; Cluster Ops</div>
        <div style="font-size:20px;color:#ffffff;font-weight:700;margin-top:4px;">${REPORT_LABEL}</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:6px;">kind-newwave-dev &nbsp;&middot;&nbsp; ${REPORT_DATE}</div>
      </td></tr>
      <tr><td style="padding:20px 24px 0 24px;">
        <div style="background:${STATUS_BG};border:1px solid ${STATUS_COLOR};border-radius:8px;padding:12px 16px;text-align:center;font-size:14px;font-weight:700;color:${STATUS_COLOR};">${STATUS_TEXT}</div>
      </td></tr>
      <tr><td style="padding:16px 18px 0 18px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>${TILES_HTML}</tr></table>
      </td></tr>
      ${CARDS_HTML}
      <tr><td style="padding:24px;">
        <a href="https://grafana.newfire.app/d/newwave-fleet/" style="display:block;text-align:center;background:#0f172a;color:#ffffff;text-decoration:none;font-size:13px;font-weight:600;padding:12px;border-radius:6px;">View Full Dashboard &rarr;</a>
      </td></tr>
      <tr><td style="padding:0 24px 24px 24px;border-top:1px solid #f1f5f9;padding-top:16px;">
        <div style="font-size:11px;color:#94a3b8;text-align:center;">Automated report &middot; sent twice daily at 07:03 and 19:07 UTC</div>
      </td></tr>
    </table>
    </td></tr>
    </table>
    </body></html>
    HTMLEOF
    )

    TO=$(cat /etc/alert-smtp/to)
    FROM=$(cat /etc/alert-smtp/from)
    APIKEY=$(cat /etc/alert-smtp/password)

    curl -s -X POST https://api.resend.com/emails \
      -H "Authorization: Bearer ${APIKEY}" \
      -H "Content-Type: application/json" \
      -d "$(jq -n --arg from "$FROM" --arg to "$TO" --arg subject "${REPORT_LABEL}: kind-newwave-dev" --arg text "$BODY" --arg html "$HTML" \
        '{from: $from, to: ($to | split(",") | map(gsub("^\\s+|\\s+$";""))), subject: $subject, text: $text, html: $html}')"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-report-morning
  namespace: otel
spec:
  schedule: "3 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cluster-report
          restartPolicy: Never
          containers:
            - name: report
              image: alpine/k8s:1.30.4
              command: ["/bin/sh", "/scripts/report.sh", "Morning Report"]
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: smtp, mountPath: /etc/alert-smtp, readOnly: true}
          volumes:
            - name: script
              configMap: {name: cluster-report-script, defaultMode: 0555}
            - name: smtp
              secret: {secretName: otel-alert-smtp}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-report-evening
  namespace: otel
spec:
  schedule: "7 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cluster-report
          restartPolicy: Never
          containers:
            - name: report
              image: alpine/k8s:1.30.4
              command: ["/bin/sh", "/scripts/report.sh", "Evening Report"]
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: smtp, mountPath: /etc/alert-smtp, readOnly: true}
          volumes:
            - name: script
              configMap: {name: cluster-report-script, defaultMode: 0555}
            - name: smtp
              secret: {secretName: otel-alert-smtp}
