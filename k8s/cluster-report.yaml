# Twice-daily cluster health report, emailed via the same Resend pipeline
# wired up for Alertmanager (otel-alert-smtp secret in this namespace -
# reuses its `password` key directly as a Resend API key, since Resend's
# REST API is simpler to call from a shell script than implementing SMTP).
#
# A real Kubernetes CronJob, not a session-bound Claude Code cron job -
# this needs to keep running whether or not any Claude session is open.
#
# Schedule is UTC (Kubernetes CronJob default) - 7am and 7pm. Adjust the
# `schedule` fields (or add `timeZone:`, supported on this cluster's k8s
# 1.34) if a different time/timezone is wanted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-report
  namespace: otel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-report
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-report
subjects:
  - kind: ServiceAccount
    name: cluster-report
    namespace: otel
roleRef:
  kind: ClusterRole
  name: cluster-report
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-report-script
  namespace: otel
data:
  report.sh: |
    #!/bin/sh
    set -eu

    REPORT_LABEL="${1:-Cluster Report}"

    NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
    NODE_NOTREADY=$(kubectl get nodes --no-headers | grep -v " Ready " || true)

    # Pods not in a healthy terminal/running state, across every namespace.
    BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null \
      | awk '$4 !~ /^Running$|^Completed$/ {print}' || true)
    BAD_POD_COUNT=$(echo "$BAD_PODS" | grep -c . || true)

    # Restart-heavy pods (>5 restarts) - a crash-looping pod that's since
    # stabilized still shows Running, so this catches what the status
    # column alone would hide.
    HIGH_RESTARTS=$(kubectl get pods -A --no-headers 2>/dev/null \
      | awk '{restarts=$5; gsub(/[^0-9].*/,"",restarts); if (restarts+0 > 5) print}' || true)

    # Fleet-wide Prometheus up{} check - the same job list the Newwave
    # Shared Infra Fleet Grafana dashboard uses.
    FLEET_JOBS="pg-oracle|pg-54agent|pg-54link-dev|pg-ucard|pg-ndsep|pg-vpp|pg-meridian|keycloak-postgres|permify-postgres|farmer-data-collection-postgres|gds-postgres|insurance-demo-postgres|lanai-postgres|nsep-demo-postgres|paymenthub-postgres|tourismpay-postgres|fineract-postgres|redis|mojaloop-auth-svc-redis|mojaloop-proxy-cache-redis|mojaloop-ttksims-redis|insurance-demo-redis|novu-redis|mongodb|ttk-mongodb|novu-mongodb|mysql|kafka|qdrant|minio|temporal-elasticsearch|etcd|dapr-placement-server|dapr-scheduler-server"
    FLEET_JSON=$(curl -s --max-time 15 -G "http://prometheus.otel.svc.cluster.local:9090/api/v1/query" \
      --data-urlencode "query=up{job=~\"$FLEET_JOBS\"}" || echo '{}')
    FLEET_DOWN=$(echo "$FLEET_JSON" | jq -r '[.data.result[] | select(.value[1]=="0") | .metric.job] | join(", ")' 2>/dev/null || echo "(query failed)")
    FLEET_DOWN_COUNT=$(echo "$FLEET_JSON" | jq -r '[.data.result[] | select(.value[1]=="0")] | length' 2>/dev/null || echo "?")
    FLEET_TOTAL=$(echo "$FLEET_JSON" | jq -r '.data.result | length' 2>/dev/null || echo "?")

    # Currently firing Alertmanager alerts.
    ALERTS_JSON=$(curl -s --max-time 15 "http://alertmanager.otel.svc.cluster.local:9093/api/v2/alerts?active=true" || echo '[]')
    ALERTS_SUMMARY=$(echo "$ALERTS_JSON" | jq -r '.[] | "  - " + .labels.alertname + " (" + .labels.severity + "): " + (.annotations.summary // "no summary")' 2>/dev/null || echo "")
    ALERTS_COUNT=$(echo "$ALERTS_JSON" | jq -r 'length' 2>/dev/null || echo "?")

    BODY=$(cat <<EOF
    ${REPORT_LABEL} - kind-newwave-dev

    NODES: ${NODE_COUNT} total
    $( [ -n "$NODE_NOTREADY" ] && echo "  NOT READY:" && echo "$NODE_NOTREADY" | sed 's/^/  - /' || echo "  all Ready" )

    PODS: ${BAD_POD_COUNT} not Running/Completed across the cluster
    $( [ -n "$BAD_PODS" ] && echo "$BAD_PODS" | awk '{print "  - "$1"/"$2" ("$4")"}' | head -20 )

    RESTART-HEAVY PODS (>5 restarts):
    $( [ -n "$HIGH_RESTARTS" ] && echo "$HIGH_RESTARTS" | awk '{print "  - "$1"/"$2" (restarts: "$5")"}' | head -20 || echo "  none" )

    SHARED INFRA FLEET: ${FLEET_DOWN_COUNT}/${FLEET_TOTAL} scrape targets down
    $( [ "$FLEET_DOWN_COUNT" != "0" ] && [ -n "$FLEET_DOWN" ] && echo "  DOWN: ${FLEET_DOWN}" || echo "  all up" )

    FIRING ALERTS: ${ALERTS_COUNT}
    ${ALERTS_SUMMARY}

    Full dashboard: https://grafana.newfire.app/d/newwave-fleet/
    EOF
    )

    echo "$BODY"

    TO=$(cat /etc/alert-smtp/to)
    FROM=$(cat /etc/alert-smtp/from)
    APIKEY=$(cat /etc/alert-smtp/password)

    curl -s -X POST https://api.resend.com/emails \
      -H "Authorization: Bearer ${APIKEY}" \
      -H "Content-Type: application/json" \
      -d "$(jq -n --arg from "$FROM" --arg to "$TO" --arg subject "${REPORT_LABEL}: kind-newwave-dev" --arg text "$BODY" \
        '{from: $from, to: $to, subject: $subject, text: $text}')"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-report-morning
  namespace: otel
spec:
  schedule: "3 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cluster-report
          restartPolicy: Never
          containers:
            - name: report
              image: alpine/k8s:1.30.4
              command: ["/bin/sh", "/scripts/report.sh", "Morning Report"]
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: smtp, mountPath: /etc/alert-smtp, readOnly: true}
          volumes:
            - name: script
              configMap: {name: cluster-report-script, defaultMode: 0555}
            - name: smtp
              secret: {secretName: otel-alert-smtp}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-report-evening
  namespace: otel
spec:
  schedule: "7 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cluster-report
          restartPolicy: Never
          containers:
            - name: report
              image: alpine/k8s:1.30.4
              command: ["/bin/sh", "/scripts/report.sh", "Evening Report"]
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: smtp, mountPath: /etc/alert-smtp, readOnly: true}
          volumes:
            - name: script
              configMap: {name: cluster-report-script, defaultMode: 0555}
            - name: smtp
              secret: {secretName: otel-alert-smtp}
