# W30 (V3#3) — CronJobs invoking the platform /api/scheduled/* routes on their
# documented cadences, using the scheduler image in --once mode with cron JWT
# auth (CRON_JWT from platform-secrets). The route allowlist + cadences are the
# single source of truth in services/scheduler/scheduler.mjs (parity asserted
# by journey J178); this manifest is generated from that table.

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-cart-recovery
  namespace: whatsapp-commerce
  labels:
    app: cron-scheduler
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: scheduler
              image: whatsapp-commerce/scheduler:latest
              args: ["node", "scheduler.mjs", "--once", "/api/scheduled/cart-recovery"]
              env:
                - name: PLATFORM_URL
                  value: "http://platform.whatsapp-commerce.svc.cluster.local:3000"
                - name: CRON_JWT
                  valueFrom:
                    secretKeyRef:
                      name: platform-secrets
                      key: CRON_JWT
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"

