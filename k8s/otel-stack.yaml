# === W34 otel-stack (Coder B) ===
# Full observability stack for whatsappCommerce: OTel Collector, Jaeger,
# Prometheus, Grafana (provisioned), Alertmanager, WhatsApp ops bridge.
# Apply: kubectl apply -k k8s/  (namespace whatsapp-commerce must exist -
# k8s/namespace.yaml provides it).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel
data:
  config.yaml: |
    # === W34 otel-stack (Coder B) ===
    # OpenTelemetry Collector configuration for whatsappCommerce.
    #
    # Pipeline: OTLP receivers (gRPC 4317 / HTTP 4318) -> memory_limiter -> batch
    #           -> tail_sampling -> Jaeger (traces)
    #           OTLP receivers -> batch -> Prometheus exporter :9464 (metrics)
    #           OTLP receivers -> batch -> spanmetrics connector -> RED metrics
    #                                      derived from spans -> Prometheus
    #
    # Tail sampling policy (documented, binding):
    #   - 100% of spans with error status are kept (errors are rare and high-signal).
    #   - 10% probabilistic baseline of OK spans (controls Jaeger storage cost).
    #   - 100% of spans slower than 2s (latency outliers).
    # Honest note: sampling is head-of-trace unaware for child spans arriving
    # without their root in the same batch window; Jaeger may show partial traces
    # for the 90% dropped baseline. This is accepted and documented here.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # === W35 infra-receivers (Coder D) ===
      # Prometheus scrape receiver: infra components that expose Prometheus
      # metrics natively are scraped here and re-exported on :9464 alongside
      # app OTLP metrics, so Prometheus/Grafana see one uniform surface.
      # Honest contract: a component WITHOUT its metrics endpoint enabled shows
      # up as a DOWN scrape target — never faked, never silently absent.
      prometheus:
        config:
          scrape_configs:
            # Keycloak management metrics. KC_METRICS_ENABLED=true is now set
            # on the shared StatefulSet (namespace `keycloak`). CORRECTION to
            # the note this replaces: that claimed port 9000 only exists in
            # Keycloak >=25 and that 8080 was the real metrics port on this
            # 24.0 image - both wrong, confirmed live: 8080/metrics is a 404,
            # 9000/metrics returns 200 with real data, same as every other
            # Keycloak version. Use the keycloak-metrics Service (not the main
            # keycloak Service, which only declares port 80/8080 at all).
            - job_name: keycloak
              metrics_path: /metrics
              scrape_interval: 30s
              static_configs:
                - targets: [keycloak-metrics.keycloak.svc.cluster.local:9000]
            # APISIX prometheus plugin export. Confirmed connection refused on
            # :9091 (appsec-apisix-dev-prometheus-metrics service exists but
            # nothing listens - the plugin isn't enabled on this instance).
            - job_name: apisix
              metrics_path: /apisix/prometheus/metrics
              scrape_interval: 30s
              static_configs:
                - targets: [appsec-apisix-dev-prometheus-metrics.appsec-apisix-dev.svc.cluster.local:9091]
            # Permify: PERMANENTLY UNSUPPORTED, not deferred - removed rather
            # than left as a guaranteed-DOWN target. Confirmed live via
            # `permify serve --help` (ghcr.io/permify/permify:v1.3.5, the
            # real shared instance) that there is no Prometheus-scrapable
            # /metrics endpoint at all, at any config. The only telemetry flag
            # is --meter-enabled, an OTLP *push* exporter that defaults to
            # Permify's own telemetry.permify.co SaaS - not something this
            # receiver can pull from. Same category as Neo4j Community /
            # TigerBeetle / Cassandra. permify-postgres (its plain Postgres,
            # not Permify itself) DOES have a postgres_exporter now - see the
            # permify-postgres job below.
            # OpenSearch via the Aiven prometheus-exporter plugin, same REST
            # port as the main API (not a separate :9600 - that port has
            # nothing behind it on the shared instance; confirmed 400 on
            # :9200 too, meaning the plugin itself isn't installed). Shared
            # instance is `shared-cluster-master` in namespace `opensearch`.
            - job_name: opensearch
              metrics_path: /_prometheus/metrics
              scrape_interval: 30s
              static_configs:
                - targets: [shared-cluster-master.opensearch.svc.cluster.local:9200]
            # whatsapp-commerce's own custom RED metrics (http_requests_total,
            # trpc_procedure_calls_total, escrow_settlements_total, etc. -
            # server/_core/telemetry.ts's promRegistry). These are separate
            # from the OTLP span pipeline above: the app exposes them itself
            # at GET /api/metrics, gated behind METRICS_TOKEN (set via
            # `kubectl set env deployment/server -n whatsapp-commerce
            # METRICS_TOKEN=...`, matching the bearer_token below) since it's
            # cross-namespace and otherwise unauthenticated. Cross-namespace
            # FQDN required: the stack lives in `otel`, the app in
            # `whatsapp-commerce`.
            - job_name: whatsapp-commerce-platform
              metrics_path: /api/metrics
              scrape_interval: 30s
              bearer_token: "02db7b2863b3a2ecffb4ffedf7913764a1a71d8e01feb04d811a3881f16d31cb"
              static_configs:
                - targets: [server.whatsapp-commerce.svc.cluster.local:3000]
            # TEMPORAL: SKIPPED (documented). No OTEL_TEMPORAL_METRICS_PORT SDK
            # metrics endpoint is exposed by services/temporal-workflows in this
            # wave — adding a static target would guarantee a permanent DOWN.
            # When Coder C exposes one, add: targets: [temporal-worker:<port>].
      # OpenAppSec log forwarding (filelog). The pinned collector image IS
      # otel/opentelemetry-collector-contrib:0.110.0 (see k8s/otel-stack.yaml),
      # which ships filelogreceiver — so this receiver IS supported. It is left
      # COMMENTED-OUT (not active) because no shared log volume between the
      # openappsec agent and otel-collector is provisioned in the current
      # manifests; activating it without the mount would crash the collector
      # on startup (missing include dir is fatal to filelog). To activate:
      #   1. mount the openappsec log dir into the collector pod,
      #   2. uncomment below,
      #   3. add `filelog/openappsec` to a logs pipeline exporters: [otlp/jaeger]-equivalent
      #      (a logs exporter such as opensearch/logging must also be added).
      # filelog/openappsec:
      #   include: [/var/log/openappsec/*.log]
      #   start_at: end
      #   operators:
      #     - type: regex_parser
      #       regex: '^(?P<time>\S+) (?P<severity>\S+) (?P<body>.*)$'
      # === END W35 infra-receivers ===

    processors:
      # memory_limiter MUST be first: shed load before the collector OOMs.
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
          - name: keep-all-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: keep-slow-traces
            type: latency
            latency:
              threshold_ms: 2000
          - name: baseline-10pct-ok
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

    connectors:
      # spanmetrics derives RED metrics (calls_total, duration histogram) from
      # spans so RED dashboards work even where only traces are emitted.
      spanmetrics:
        histogram:
          explicit:
            buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
        dimensions:
          # status.code is NOT listed here: spanmetricsconnector includes it
          # as a default dimension automatically, and explicitly redeclaring
          # it is a hard startup error ("duplicate dimension name status.code").
          - name: tenant.id
            default: other
        namespace: otel_span

    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:9464
        resource_to_telemetry_conversion:
          enabled: true
      logging:
        loglevel: warn

    extensions:
      # Runtime liveness endpoint (used by k8s httpGet probes; the distroless
      # collector image has no shell, so compose uses a binary self-check).
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, tail_sampling]
          exporters: [otlp/jaeger, logging]
        traces/spanmetrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [spanmetrics]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, logging]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        # === W35 infra-receivers (Coder D) ===
        # Scraped infra metrics (keycloak/apisix/permify/opensearch) re-exported
        # on :9464. W34 pipelines above are untouched (tail-sampling intact).
        metrics/infra-scrape:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        # === END W35 infra-receivers ===
    # === END W34 otel-stack ===
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-prometheus-config
  namespace: otel
data:
  prometheus.yml: |
    # === W34 otel-stack (Coder B) ===
    # Prometheus scrape configuration for whatsappCommerce observability stack.
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        platform: whatsapp-commerce
    
    rule_files:
      - /etc/prometheus/alert-rules.yml
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]
    
    scrape_configs:
      # Platform /api/metrics (Coder A, prom-client). Auth via METRICS_TOKEN bearer.
      # The endpoint honestly 503s when telemetry is disabled — Prometheus will
      # report the target down rather than scraping garbage.
      - job_name: platform
        metrics_path: /api/metrics
        scheme: http
        # Prometheus does not expand env vars in config; the token is mounted as
        # a file (compose `configs:` renders it from METRICS_TOKEN).
        bearer_token_file: /etc/prometheus/secrets/metrics_token
        static_configs:
          - targets: [platform:3000]
      # Collector's Prometheus exporter (:9464) — spanmetrics-derived RED +
      # forwarded OTel metrics.
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector:9464]
      # Alertmanager self-metrics (alert delivery health).
      - job_name: alertmanager
        static_configs:
          - targets: [alertmanager:9093]
      # Prometheus self.
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      # pg-oracle's CNPG instance-manager built-in metrics (port 9187,
      # confirmed live via direct curl to the pod) - cross-namespace target,
      # needs the full Service DNS name (short names only resolve within
      # the same namespace as this Prometheus pod, which lives in `otel`).
      # Routed via a new Service (pg-oracle-metrics), since none of CNPG's
      # own operator-managed Services (pg-oracle-r/-ro/-rw) expose this
      # port - see apps/postgres-oracle-newwave-dev/main.tf in the
      # newwave_platform_terraform repo.
      - job_name: pg-oracle
        static_configs:
          - targets: [pg-oracle-metrics.postgres-oracle.svc.cluster.local:9187]
      # Kafka broker JMX metrics (port 9404, jmx_prometheus_javaagent running
      # in-process in the broker JVM - see clusters/newwave-dev/shared-infra/
      # kafka-cluster.yaml in newwave_platform_terraform). No new Service
      # needed: mojaloop-kafka-cluster-kafka-brokers is already a headless
      # Service, so the pod's own DNS name resolves directly. Single broker
      # today (dual-role-0) - hardcoded; would need Kubernetes SD instead of
      # a static target if this ever becomes a multi-broker cluster.
      - job_name: kafka
        static_configs:
          - targets: [mojaloop-kafka-cluster-dual-role-0.mojaloop-kafka-cluster-kafka-brokers.kafka.svc.cluster.local:9404]
      # Redis has no built-in Prometheus support - redis_exporter sidecar
      # deployed alongside it (clusters/newwave-dev/shared-infra/
      # redis-exporter.yaml), authenticates with the same REDIS_PASSWORD
      # secret the real Redis clients use. Confirmed live: redis_up 1.
      - job_name: redis
        static_configs:
          - targets: [redis-exporter.redis.svc.cluster.local:9121]
      # mojaloop's MySQL - mysqld_exporter sidecar (clusters/newwave-dev/
      # shared-infra/mysql-exporter.yaml). Confirmed live: mysql_up 1.
      - job_name: mysql
        static_configs:
          - targets: [mysql-exporter.mojaloop-database.svc.cluster.local:9104]
      # mojaloop's cl-mongodb (central-ledger Mongo replica set) -
      # mongodb_exporter sidecar (clusters/newwave-dev/shared-infra/
      # mongodb-exporter.yaml). Confirmed live: mongodb_up 1.
      - job_name: mongodb
        static_configs:
          - targets: [mongodb-exporter.mojaloop.svc.cluster.local:9216]
      # 6 more CNPG Postgres clusters found on a full cluster sweep -
      # pg-oracle wasn't the only one. Same built-in metrics port (9187),
      # same missing-Service gap, same fix pattern across every one.
      - job_name: pg-54agent
        static_configs:
          - targets: [pg-54agent-metrics.54agent.svc.cluster.local:9187]
      - job_name: pg-54link-dev
        static_configs:
          - targets: [pg-54link-dev-metrics.54link-dev.svc.cluster.local:9187]
      - job_name: pg-ucard
        static_configs:
          - targets: [pg-ucard-metrics.ucard.svc.cluster.local:9187]
      - job_name: pg-ndsep
        static_configs:
          - targets: [pg-ndsep-metrics.ndsep.svc.cluster.local:9187]
      - job_name: pg-vpp
        static_configs:
          - targets: [pg-vpp-metrics.vpp.svc.cluster.local:9187]
      - job_name: pg-meridian
        static_configs:
          - targets: [pg-meridian-metrics.meridian.svc.cluster.local:9187]
      # mojaloop's 3 other Redis deployments, beyond the standalone `redis`
      # namespace instance already covered above. All run with no auth
      # (confirmed live). proxy-cache-redis is a real 6-node Redis Cluster;
      # only the leader Service is scraped here as a representative sample.
      - job_name: mojaloop-auth-svc-redis
        static_configs:
          - targets: [auth-svc-redis-exporter.mojaloop.svc.cluster.local:9121]
      - job_name: mojaloop-proxy-cache-redis
        static_configs:
          - targets: [proxy-cache-redis-exporter.mojaloop.svc.cluster.local:9121]
      - job_name: mojaloop-ttksims-redis
        static_configs:
          - targets: [ttksims-redis-exporter.mojaloop.svc.cluster.local:9121]
      # mojaloop's second Mongo replica set (Testing Toolkit's own), beyond
      # cl-mongodb already covered above.
      - job_name: ttk-mongodb
        static_configs:
          - targets: [ttk-mongodb-exporter.mojaloop.svc.cluster.local:9216]
      # Qdrant has built-in Prometheus metrics, fully open on its existing
      # Service - no new Service or exporter needed. Confirmed live.
      - job_name: qdrant
        static_configs:
          - targets: [qdrant.qdrant.svc.cluster.local:6333]
      # MinIO has built-in Prometheus metrics too, but the cluster-metrics
      # endpoint requires a bearer token - generated via `mc admin
      # prometheus generate` (a long-lived JWT signed with MinIO's root
      # credentials), stored as the minio-prometheus-token Secret (see the
      # Prometheus Deployment's new `secrets` volume above). Confirmed live.
      - job_name: minio
        metrics_path: /minio/v2/metrics/cluster
        bearer_token_file: /etc/prometheus/secrets/token
        static_configs:
          - targets: [minio.minio.svc.cluster.local:9000]
      # kube-state-metrics (k8s/kube-state-metrics.yaml) - real pod/deployment
      # state (kube_pod_status_phase, kube_pod_container_status_restarts_total,
      # etc), not derivable from up{} alone.
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.otel.svc.cluster.local:8080]
      # blackbox-exporter (k8s/blackbox-exporter.yaml) - Permify and TigerBeetle
      # have no Prometheus metrics of their own; probe_success{job=...} here
      # is a real HTTP /healthz check (Permify) and a real mTLS handshake
      # check (TigerBeetle, same stunnel endpoint healthpoint connects to).
      - job_name: blackbox-permify
        metrics_path: /probe
        params: {module: [http_2xx]}
        static_configs:
          - targets: [http://permify.permify.svc.cluster.local:3476/healthz]
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: blackbox-exporter.otel.svc.cluster.local:9115}
      - job_name: blackbox-tigerbeetle
        metrics_path: /probe
        params: {module: [tcp_tls_connect]}
        static_configs:
          - targets: ["173.66.76.192:32052"]
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: blackbox-exporter.otel.svc.cluster.local:9115}
      - job_name: blackbox-temporal
        metrics_path: /probe
        params: {module: [tcp_tls_verify_only]}
        static_configs:
          - targets: ["temporal-secure-proxy.temporal.svc.cluster.local:8444"]
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: blackbox-exporter.otel.svc.cluster.local:9115}
      # Temporal's own Elasticsearch (visibility store) - elasticsearch_exporter
      # sidecar (clusters/newwave-dev/shared-infra/
      # temporal-elasticsearch-exporter.yaml). Confirmed live: real cluster
      # health data returned, no auth needed.
      - job_name: temporal-elasticsearch
        static_configs:
          - targets: [temporal-elasticsearch-exporter.temporal.svc.cluster.local:9114]
      # keycloak-postgresql's dedicated exporter (see keycloak-postgres-exporter.yaml
      # in newwave_platform_terraform/clusters/newwave-dev/shared-infra/).
      - job_name: keycloak-postgres
        static_configs:
          - targets: [keycloak-postgres-exporter.keycloak.svc.cluster.local:9187]
      # permify-postgres's dedicated exporter (Terraform-managed, see
      # apps/permify-newwave-dev/main.tf). Permify itself has no Prometheus
      # support - see the note above where its job_name was removed.
      - job_name: permify-postgres
        static_configs:
          - targets: [permify-postgres-exporter.permify.svc.cluster.local:9187]
      # apisix-etcd-dev: real etcd cluster backing APISIX's config store.
      # Headless Service (clusterIP: None, no declared port) - DNS still
      # resolves to the 3 pod IPs directly, confirmed live on :2379/metrics
      # (etcd serves Prometheus metrics on its client port by default).
      - job_name: etcd
        static_configs:
          - targets: [apisix-etcd-dev.appsec-apisix-dev.svc.cluster.local:2379]
      # dapr control-plane services, both confirmed live on :9090/metrics.
      - job_name: dapr-placement-server
        static_configs:
          - targets: [dapr-placement-server.dapr-system.svc.cluster.local:9090]
      - job_name: dapr-scheduler-server
        static_configs:
          - targets: [dapr-scheduler-server.dapr-system.svc.cluster.local:9090]
      # Final cluster-wide sweep (all namespaces): every remaining app with
      # its own dedicated Postgres/Redis/Mongo, each Terraform-tracked in
      # apps/<app>-newwave-dev/main.tf. gds, paymenthub and fineract are
      # confirmed live-scaled to 0 replicas across their ENTIRE namespace
      # (not just the DB) - honestly DOWN, not a wiring bug; will read `up`
      # again the moment someone scales those apps back on.
      - job_name: farmer-data-collection-postgres
        static_configs:
          - targets: [postgres-exporter.farmer-data-collection.svc.cluster.local:9187]
      - job_name: gds-postgres
        static_configs:
          - targets: [postgres-exporter.gds.svc.cluster.local:9187]
      - job_name: insurance-demo-postgres
        static_configs:
          - targets: [postgres-exporter.insurance-platform-demo.svc.cluster.local:9187]
      - job_name: insurance-demo-redis
        static_configs:
          - targets: [redis-exporter.insurance-platform-demo.svc.cluster.local:9121]
      - job_name: lanai-postgres
        static_configs:
          - targets: [postgres-exporter.lanai.svc.cluster.local:9187]
      - job_name: novu-mongodb
        static_configs:
          - targets: [mongodb-exporter.novu.svc.cluster.local:9216]
      - job_name: novu-redis
        static_configs:
          - targets: [redis-exporter.novu.svc.cluster.local:9121]
      - job_name: nsep-demo-postgres
        static_configs:
          - targets: [postgres-exporter.nsep-demo.svc.cluster.local:9187]
      - job_name: paymenthub-postgres
        static_configs:
          - targets: [postgres-exporter.paymenthub.svc.cluster.local:9187]
      - job_name: tourismpay-postgres
        static_configs:
          - targets: [postgres-exporter.tourismpay.svc.cluster.local:9187]
      - job_name: fineract-postgres
        static_configs:
          - targets: [postgres-exporter.fineract.svc.cluster.local:9187]
    # === END W34 otel-stack ===
  alert-rules.yml: |
    # === W34 otel-stack (Coder B) ===
    # Prometheus alert rules for whatsappCommerce.
    #
    # Metric names are BINDING assumptions on the platform /api/metrics surface
    # (Coder A): http_requests_total{route,status_class,tenant_class},
    # trpc_procedure_calls_total{result="error"} (errors) / trpc_procedure_calls_total (all),
    # escrow_settlements_total{outcome}, payout_latency_ms (histogram, *_bucket),
    # cron_runs_total{route,result}, infra_component_up{component} (x15),
    # readiness probe failures surface as http_requests_total on /health/ready
    # with status_class="5xx".
    #
    # Honest test note: J218 validates these exprs with a balanced-delimiter /
    # selector parser (not full PromQL); rules were also kept to std PromQL
    # constructs. No rule is a placeholder — every rule below is real, but each
    # is only as live as the metric it references: if A's metric names drift,
    # the rule evaluates empty (Prometheus shows it as inactive, NOT firing) —
    # this is the honest-degradation contract.
    groups:
      - name: w34-platform
        interval: 30s
        rules:
          # Readiness flapping: sustained 5xx on /health/ready over 5m.
          - alert: ReadinessFlapping
            expr: sum(rate(http_requests_total{route="/health/ready",status_class="5xx"}[5m])) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Platform readiness endpoint returning 5xx"
              description: "/health/ready has served 5xx for 5m; orchestrator may restart pods. Check platform logs and infra components."

          # Elevated 5xx across all routes (>5% of traffic for 5m).
          - alert: Elevated5xx
            expr: |
              sum(rate(http_requests_total{status_class="5xx"}[5m]))
                /
              sum(rate(http_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Elevated 5xx rate (>5% for 5m)"
              description: "More than 5% of HTTP requests are failing. Check error logs and downstream components."

          # Any cron route reporting result="error" in the last 15m.
          - alert: CronFailure
            expr: increase(cron_runs_total{result="error"}[15m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Cron job failure: {{ $labels.route }}"
              description: "Cron route {{ $labels.route }} recorded at least one error in the last 15m."

          # Escrow settlement errors (money rail — always critical).
          - alert: EscrowSettleFailure
            expr: increase(escrow_settlements_total{outcome="error"}[15m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Escrow settlement failures detected"
              description: "escrow_settlements_total{outcome=error} increased in the last 15m. Money movement is failing — page ops."

          # Payout latency p95 > 30s sustained 10m.
          - alert: PayoutLatencyHigh
            expr: histogram_quantile(0.95, sum(rate(payout_latency_ms_bucket[10m])) by (le)) > 30000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Payout latency p95 above 30s"
              description: "p95 payout latency has exceeded 30s for 10m. Check PSP connectivity and ledger-bridge."

          # Per-tenant error spike: >3 sigma above the tenant's own 1h baseline.
          # Allowlist-only: tenant_class is "other" for non-allowlisted tenants,
          # so cardinality of this alert is bounded by OTEL_TENANT_METRIC_ALLOWLIST.
          - alert: TenantErrorSpike
            expr: |
              (
                sum by (tenant_class) (rate(trpc_procedure_calls_total{result="error"}[5m]))
                  -
                avg_over_time(sum by (tenant_class) (rate(trpc_procedure_calls_total{result="error"}[5m]))[1h:5m])
              )
                >
              3 * stddev_over_time(sum by (tenant_class) (rate(trpc_procedure_calls_total{result="error"}[5m]))[1h:5m])
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Tenant error spike: {{ $labels.tenant_class }}"
              description: "tRPC error rate for tenant_class={{ $labels.tenant_class }} is >3 sigma above its 1h baseline."

          # Infra component down (infra_component_up gauge x15) for 5m.
          - alert: ComponentDown
            expr: infra_component_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Infra component down: {{ $labels.component }}"
              description: "infra_component_up{component={{ $labels.component }}} has been 0 for 5m. See Infra components dashboard."
    # === END W34 otel-stack ===

    # === W35 infra-receivers (Coder D) ===
    # Rules for the W35 full-mesh wave. Same honest-degradation contract as the
    # W34 block: every rule is real PromQL, but only as live as its metric.
    #   - GoServiceDown / RustServiceDown reference up{job=...}: no scrape jobs
    #     for the Go/Rust services exist this wave (they push OTLP, they are not
    #     scraped), so these rules evaluate EMPTY (inactive, not firing) until
    #     per-service scrape jobs or a workdesk exporter are added. This matches
    #     the spec's requested up==0 5m form without faking liveness.
    #   - Temporal/TigerBeetle rules read spanmetrics (otel_span_calls_total),
    #     which IS live whenever OTEL_ENABLED=true and spans flow.
    #   - Kafka consumer lag: NO lag exporter is deployed in this stack (no
    #     kube-state-metrics/kafka-lag-exporter), so no lag rule is added —
    #     a rule against a nonexistent metric would be placebo. Adding a lag
    #     exporter is follow-up work; this comment is the honest record.
      - name: w35-infra-otel
        interval: 30s
        rules:
          # Any Go service scrape target down for 5m (see header note: currently
          # inert until Go services get scrape jobs).
          - alert: GoServiceDown
            expr: up{job=~"commerce-engine|conversation-orchestrator|crm-adapter|erp-adapter|event-gateway|gateway|hermes-bridge|notification-service|payment-orchestrator|visual-inventory|go-orchestrator"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Go service down: {{ $labels.job }}"
              description: "Prometheus target for Go service {{ $labels.job }} has been down 5m. Check pod status and the Go Services RED dashboard."

          # Any Rust service scrape target down for 5m (same inert-until-scraped
          # caveat as GoServiceDown).
          - alert: RustServiceDown
            expr: up{job=~"event-processor|hermes-router|ledger-bridge|recon-worker|fluvio-consumer"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Rust service down: {{ $labels.job }}"
              description: "Prometheus target for Rust service {{ $labels.job }} has been down 5m. Check pod status and the Rust Services RED dashboard."

          # Temporal workflow/activity failures (spanmetrics-derived, live when
          # OTEL_ENABLED=true). Any error span in 15m pages as warning.
          - alert: TemporalWorkflowFailures
            expr: sum(increase(otel_span_calls_total{span_name=~"temporal\\..+",status_code="STATUS_CODE_ERROR"}[15m])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Temporal workflow/activity failures detected"
              description: "Error spans named temporal.* increased in the last 15m. Check temporal-worker logs and the Tenant 360 temporal panels."

          # TigerBeetle op errors — money rail, always critical.
          - alert: TigerBeetleOpErrors
            expr: sum(rate(otel_span_calls_total{span_name=~"tigerbeetle\\..+",status_code="STATUS_CODE_ERROR"}[5m])) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "TigerBeetle operation errors"
              description: "Error spans named tigerbeetle.* sustained for 5m. Ledger ops are failing — check ledger-bridge and tigerbeetle."
    # === END W35 infra-receivers ===
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-alertmanager-config
  namespace: otel
data:
  alertmanager.yml: |
    # === W34 otel-stack (Coder B) ===
    # Alertmanager configuration for whatsappCommerce.
    # Receivers: email (SMTP via env) + webhook (WhatsApp ops bridge).
    # Routing: severity=critical -> webhook + email; severity=warning -> email.
    # === W35 infra-receivers (Coder D) ===
    # W35 rules (GoServiceDown, RustServiceDown, TemporalWorkflowFailures,
    # TigerBeetleOpErrors in alert-rules.yml group w35-infra-otel) reuse these
    # severity routes unchanged: critical -> critical-all (email + WhatsApp WA
    # bridge webhook), warning -> email-default. No new receivers were needed;
    # the WA bridge is the same W34 alertmanager-wa-bridge:9099/alerts endpoint.
    # === END W35 infra-receivers ===
    # Inhibition: a critical alert suppresses warning alerts with the same
    # alertname/namespace; ComponentDown suppresses dependent Elevated5xx noise
    # for the same platform.
    route:
      receiver: email-default
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity = "critical"
          receiver: critical-all
          continue: true
        - matchers:
            - severity = "warning"
          receiver: email-default

    receivers:
      - name: email-default
        email_configs:
          - to: ${ALERT_EMAIL_TO}
            from: ${ALERT_EMAIL_FROM}
            smarthost: ${SMTP_HOST}:${SMTP_PORT}
            auth_username: ${SMTP_USER}
            auth_password: ${SMTP_PASSWORD}
            require_tls: true
      - name: critical-all
        email_configs:
          - to: ${ALERT_EMAIL_TO}
            from: ${ALERT_EMAIL_FROM}
            smarthost: ${SMTP_HOST}:${SMTP_PORT}
            auth_username: ${SMTP_USER}
            auth_password: ${SMTP_PASSWORD}
            require_tls: true
        webhook_configs:
          # WhatsApp ops bridge (deploy/otel/alertmanager-wa-bridge.mjs).
          # Fail-open: bridge down only loses the WhatsApp copy; email still fires.
          - url: http://alertmanager-wa-bridge:9099/alerts
            send_resolved: true
            max_alerts: 20

    inhibit_rules:
      # A critical alert suppresses same-name warnings.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: [alertname]
      # ComponentDown suppresses Elevated5xx noise (downstream symptom).
      - source_matchers:
          - alertname = "ComponentDown"
        target_matchers:
          - alertname = "Elevated5xx"
        equal: []
    # === END W34 otel-stack ===
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-grafana-provisioning
  namespace: otel
data:
  datasources.yaml: |
    # === W34 otel-stack (Coder B) ===
    apiVersion: 1
    datasources:
      # uid pinned explicitly: every provisioned dashboard's panels/variables
      # reference datasource uid "Prometheus"/"Jaeger" literally (matching
      # the name, a common Grafana convention) - without pinning it here,
      # Grafana auto-generates a random uid instead, and every one of those
      # references silently points at a datasource that doesn't exist.
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Jaeger
        uid: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
    # === END W34 otel-stack ===
  dashboards.yaml: |
    # === W34 otel-stack (Coder B) ===
    apiVersion: 1
    providers:
      - name: w34-otel-stack
        orgId: 1
        folder: "W34 Observability"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
    # === END W34 otel-stack ===
