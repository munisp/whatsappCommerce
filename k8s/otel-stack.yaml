  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
# PREREQUISITE (not expressed here - secret values don't belong in git): an
# `otel-alert-smtp` Secret must exist in this namespace (otel) with keys
# to/from/host/port/user/password - real Resend SMTP relay credentials, not
# placeholders. `from` uses upi.dev (confirmed live via a real Resend send:
# verified with Resend, not just DNS-routable) - a dedicated Resend API key
# for this domain, not the whatsapp-commerce app's own key. Created via:
#   kubectl create secret generic otel-alert-smtp -n otel \
#     --from-literal=to=<alert recipient email> \
#     --from-literal=from="Newwave Alerts <alerts@upi.dev>" \
#     --from-literal=host=smtp.resend.com \
#     --from-literal=port=587 \
#     --from-literal=user=resend \
#     --from-literal=password=<the upi.dev Resend API key>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: otel
  labels: {app: alertmanager}
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager}}
  template:
    metadata: {labels: {app: alertmanager}}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          # Alertmanager does not expand ${...} in its own config - render the
          # ConfigMap-mounted template with sed at container start (busybox sh
          # is present in this image), same approach docker-compose already
          # uses for local dev (see docker-compose.yml's alertmanager service).
          # Real values: Resend's SMTP relay (smtp.resend.com, username
          # literally "resend", password = a dedicated Resend API key),
          # sending from upi.dev - confirmed verified with Resend via a real
          # test send (not just a domain the org owns for HTTP routing).
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -e "s|\${ALERT_EMAIL_TO}|$ALERT_EMAIL_TO|g" \
                  -e "s|\${ALERT_EMAIL_FROM}|$ALERT_EMAIL_FROM|g" \
                  -e "s|\${SMTP_HOST}|$SMTP_HOST|g" \
                  -e "s|\${SMTP_PORT}|$SMTP_PORT|g" \
                  -e "s|\${SMTP_USER}|$SMTP_USER|g" \
                  -e "s|\${SMTP_PASSWORD}|$SMTP_PASSWORD|g" \
                  /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && \
              exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --web.external-url=https://alertmanager.newfire.app
          env:
            - {name: ALERT_EMAIL_TO, valueFrom: {secretKeyRef: {name: otel-alert-smtp, key: to}}}
            - {name: ALERT_EMAIL_FROM, valueFrom: {secretKeyRef: {name: otel-alert-smtp, key: from}}}
            - {name: SMTP_HOST, valueFrom: {secretKeyRef: {name: otel-alert-smtp, key: host}}}
            - {name: SMTP_PORT, valueFrom: {secretKeyRef: {name: otel-alert-smtp, key: port}}}
            - {name: SMTP_USER, valueFrom: {secretKeyRef: {name: otel-alert-smtp, key: user}}}
            - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: otel-alert-smtp, key: password}}}
          ports:
            - {containerPort: 9093}
          readinessProbe:
            httpGet: {path: /-/healthy, port: 9093}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 256Mi, cpu: 200m}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-alertmanager-config}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: otel}
spec:
  selector: {app: alertmanager}
  ports:
    - {name: http, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-wa-bridge
  namespace: otel
  labels: {app: alertmanager-wa-bridge}
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager-wa-bridge}}
  template:
    metadata: {labels: {app: alertmanager-wa-bridge}}
    spec:
      containers:
        - name: wa-bridge
          image: node:22-alpine
          command: ["node", "/app/alertmanager-wa-bridge.mjs"]
          env:
            - {name: ALERTMANAGER_WA_BRIDGE_ENABLED, value: "false"}  # disabled-default; set "true" to enable
            - {name: WA_BRIDGE_PORT, value: "9099"}
            # Cross-namespace: this stack lives in `otel`, the app in
            # `whatsapp-commerce` - and the actual Service is named `server`,
            # not `platform` (which never existed; harmless only because
            # ALERTMANAGER_WA_BRIDGE_ENABLED defaults to false).
            - {name: PLATFORM_API_URL, value: "http://server.whatsapp-commerce.svc.cluster.local:3000"}
            - {name: INTERNAL_API_KEY, valueFrom: {secretKeyRef: {name: platform-internal, key: INTERNAL_API_KEY, optional: true}}}
            - {name: OPS_ALERT_WHATSAPP, valueFrom: {secretKeyRef: {name: platform-internal, key: OPS_ALERT_WHATSAPP, optional: true}}}
          ports:
            - {containerPort: 9099}
          readinessProbe:
            httpGet: {path: /health, port: 9099}
            initialDelaySeconds: 3
            periodSeconds: 15
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 128Mi, cpu: 100m}
          volumeMounts:
            - {name: src, mountPath: /app, readOnly: true}
      volumes:
        - name: src
          configMap: {name: otel-wa-bridge-src}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager-wa-bridge, namespace: otel}
spec:
  selector: {app: alertmanager-wa-bridge}
  ports:
    - {name: http, port: 9099, targetPort: 9099}
# === END W34 otel-stack ===
