        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket{tenant_class=\"$tenant\"}[5m])) by (le))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
