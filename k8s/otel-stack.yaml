            "h": 8,
            "w": 12,
            "x": 12,
            "y": 38
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "kube_pod_container_status_restarts_total{namespace=\"ndsep\"}"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "uid": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "Value": "Restarts"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "cellOptions": {
                  "type": "color-background"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 6
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 17,
          "title": "Pod logs (namespace: ndsep)",
          "type": "logs",
          "gridPos": {
            "x": 0,
            "y": 46,
            "w": 24,
            "h": 12
          },
