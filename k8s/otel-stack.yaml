apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-grafana-dashboard-newwave-fleet
  namespace: otel
data:
  newwave-fleet-dashboard.json: |
    {
      "uid": "newwave-fleet",
      "title": "Newwave Shared Infra Fleet",
      "description": "Single-pane view of every shared/data-layer resource wired for Prometheus metrics across the kind-newwave-dev cluster: all Postgres instances (CNPG + plain), Redis, MongoDB, MySQL, Kafka, Elasticsearch, MinIO, Qdrant, etcd, Dapr, and Keycloak. Data source: the Prometheus deployed in the `otel` namespace.",
      "tags": [
        "fleet",
        "infra",
        "shared-resources"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 100,
          "title": "Newwave Shared Infra Fleet",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 2
          },
          "options": {
            "mode": "markdown",
            "content": "Every shared data-layer resource this cluster's apps depend on, in one place. Green = up, red = down. Postgres/Redis/MongoDB/MySQL boxes reflect the *database itself* answering (not just the exporter pod being alive) \u2014 a box can be red while its own scrape still succeeds, meaning the exporter is fine but the database behind it isn't. `gds`, `paymenthub` and `fineract` show red by design: those namespaces are currently scaled to 0 replicas."
          }
        },
        {
          "id": 1,
          "title": "Fleet health \u2014 every scrape target",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 2,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "#b06a6a"
                    },
                    "1": {
                      "text": "UP",
                      "color": "#7ba17b"
                    }
                  }
                }
              ],
              "thresholds": {
                "steps": [
                  {
                    "color": "#b06a6a",
                    "value": null
                  },
                  {
                    "color": "#7ba17b",
                    "value": 1
                  }
                ]
              },
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background",
            "reduceOptions": {
              "values": true,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=~\"pg-oracle|pg-54agent|pg-54link-dev|pg-ucard|pg-ndsep|pg-vpp|pg-meridian|keycloak-postgres|permify-postgres|farmer-data-collection-postgres|gds-postgres|insurance-demo-postgres|lanai-postgres|nsep-demo-postgres|paymenthub-postgres|tourismpay-postgres|fineract-postgres|redis|mojaloop-auth-svc-redis|mojaloop-proxy-cache-redis|mojaloop-ttksims-redis|insurance-demo-redis|novu-redis|mongodb|ttk-mongodb|novu-mongodb|mysql|kafka|qdrant|minio|temporal-elasticsearch|etcd|dapr-placement-server|dapr-scheduler-server\"}",
              "legendFormat": "{{job}}",
              "instant": true
            }
          ]
        },
        {
          "id": 2,
          "title": "Healthy targets over time",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 2
              },
              "min": 0
