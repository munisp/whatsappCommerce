            "mode": "markdown",
            "content": "### Alert history\n\nPer-tenant alerts (TenantErrorSpike) fire only for allowlisted tenants and are routed by Alertmanager. Alert history is queried live from the Alertmanager API (`/api/v2/alerts`, filter `tenant=\"$tenant\"`) \u2014 this panel is intentionally a pointer, not fabricated data: wire an Alertmanager datasource in Grafana to render it inline."
