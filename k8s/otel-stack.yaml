        {
          "id": 21,
          "title": "Redis connected clients",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 42,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "redis_connected_clients",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 30,
          "title": "Recent errors across the fleet (Loki)",
          "type": "logs",
          "gridPos": {
            "x": 0,
            "y": 50,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessages": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=~\".+\"} | detected_level=\"error\"",
              "maxLines": 200
            }
          ]
        },
        {
          "id": 31,
          "title": "Log volume by namespace (Loki)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 60,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 50,
                "stacking": {
                  "mode": "normal"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (count_over_time({namespace=~\".+\"}[5m]))",
              "legendFormat": "{{namespace}}"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-grafana-dashboard-healthpoint
  namespace: otel
data:
  healthpoint.json: |
    {
      "title": "HealthPoint",
      "uid": "w36-healthpoint",
      "description": "HealthPoint (healthpoint-api) service health. Only SPAN_KIND_CLIENT spans are emitted by this service's auto-instrumentation (outbound HTTP calls to Keycloak/MinIO/Temporal/Redis, etc.) - there is no inbound SPAN_KIND_SERVER data, so request-rate/error panels here measure healthpoint's own outbound dependency calls, not inbound traffic to healthpoint itself. Node.js process health (event loop, V8 heap/GC) is real per-process data.",
      "tags": ["w36", "otel", "healthpoint"],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Outbound call rate (req/s)",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(rate(otel_span_calls_total{exported_job=\"healthpoint-api\"}[5m]))", "legendFormat": "calls/s"}],
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "blue"}, "unit": "reqps"}, "overrides": []},
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Outbound error ratio",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(rate(otel_span_calls_total{exported_job=\"healthpoint-api\",status_code=\"STATUS_CODE_ERROR\"}[5m])) / clamp_min(sum(rate(otel_span_calls_total{exported_job=\"healthpoint-api\"}[5m])), 1e-9)", "legendFormat": "error ratio"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.02}, {"color": "red", "value": 0.1}]}}, "overrides": []},
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Outbound call p95 duration",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 0},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(otel_span_duration_milliseconds_bucket{exported_job=\"healthpoint-api\"}[5m])))", "legendFormat": "p95 ms"}],
          "fieldConfig": {"defaults": {"unit": "ms", "color": {"mode": "fixed", "fixedColor": "purple"}}, "overrides": []},
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Outbound calls by method",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "targets": [{"refId": "A", "expr": "sum by (span_name) (rate(otel_span_calls_total{exported_job=\"healthpoint-api\"}[5m]))", "legendFormat": "{{span_name}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Outbound errors over time",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "targets": [{"refId": "A", "expr": "sum by (span_name) (rate(otel_span_calls_total{exported_job=\"healthpoint-api\",status_code=\"STATUS_CODE_ERROR\"}[5m]))", "legendFormat": "{{span_name}} errors/s"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "color": {"mode": "fixed", "fixedColor": "red"}}, "overrides": []}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Node.js event loop utilization",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "targets": [{"refId": "A", "expr": "avg by (host_name) (nodejs_eventloop_utilization_ratio{exported_job=\"healthpoint-api\"})", "legendFormat": "{{host_name}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0}, "overrides": []}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "V8 heap used vs limit",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "targets": [
            {"refId": "A", "expr": "avg by (host_name) (v8js_memory_heap_used_bytes{exported_job=\"healthpoint-api\"})", "legendFormat": "{{host_name}} used"},
            {"refId": "B", "expr": "avg by (host_name) (v8js_memory_heap_limit_bytes{exported_job=\"healthpoint-api\"})", "legendFormat": "{{host_name}} limit"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "GC pause duration (p95)",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(v8js_gc_duration_seconds_bucket{exported_job=\"healthpoint-api\"}[5m])))", "legendFormat": "p95 GC pause"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Event loop delay (mean / p99)",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 22},
          "targets": [
            {"refId": "A", "expr": "avg by (host_name) (nodejs_eventloop_delay_mean_seconds{exported_job=\"healthpoint-api\"})", "legendFormat": "{{host_name}} mean"},
            {"refId": "B", "expr": "avg by (host_name) (nodejs_eventloop_delay_p99_seconds{exported_job=\"healthpoint-api\"})", "legendFormat": "{{host_name}} p99"}
          ],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Middleware: Keycloak",
          "description": "up{exported_job=\"keycloak\"} - the auth server healthpoint depends on for OIDC.",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 30},
          "targets": [{"refId": "A", "expr": "up{exported_job=\"keycloak\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 11,
          "title": "Middleware: Postgres (pg-oracle)",
          "type": "stat",
          "description": "up{job=\"pg-oracle\"} - healthpoint's DATABASE_URL points at the shared pg-oracle instance (apps/healthpoint-newwave-dev/main.tf), not a dedicated DB.",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 30},
          "targets": [{"refId": "A", "expr": "up{job=\"pg-oracle\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 12,
          "title": "Middleware: Redis (shared)",
          "type": "stat",
          "description": "up{job=\"redis\"} - healthpoint's REDIS_URL points at the shared redis-master instance (used for Redlock and session cache), not a dedicated Redis.",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 30},
          "targets": [{"refId": "A", "expr": "up{job=\"redis\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 13,
          "title": "Middleware: MinIO (shared)",
          "type": "stat",
          "description": "up{job=\"minio\"} - healthpoint's S3_ENDPOINT points at the shared MinIO instance (dispute attachments/exports), not a dedicated bucket store.",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 30},
          "targets": [{"refId": "A", "expr": "up{job=\"minio\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 20,
          "title": "Middleware: Kafka",
          "type": "stat",
          "description": "up{job=\"kafka\"} - the shared mojaloop-kafka-cluster broker healthpoint's IDR event consumer (idr.dispute.events/idr.payments/idr.audit) connects to.",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 36},
          "targets": [{"refId": "A", "expr": "up{job=\"kafka\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 22,
          "title": "Middleware: Permify",
          "type": "stat",
          "description": "probe_success{job=\"blackbox-permify\"} - blackbox-exporter doing a real HTTP GET against Permify's own /healthz (Permify has no Prometheus metrics of its own).",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 36},
          "targets": [{"refId": "A", "expr": "probe_success{job=\"blackbox-permify\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 23,
          "title": "Middleware: TigerBeetle",
          "type": "stat",
          "description": "probe_success{job=\"blackbox-tigerbeetle\"} - blackbox-exporter doing a real mutual-TLS handshake against the same mTLS proxy healthpoint's own tunnel connects to (TigerBeetle's binary protocol has no Prometheus metrics of its own).",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 36},
          "targets": [{"refId": "A", "expr": "probe_success{job=\"blackbox-tigerbeetle\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 14,
          "title": "Middleware: Temporal",
          "type": "stat",
          "description": "probe_success{job=\"blackbox-temporal\"} - blackbox-exporter doing a real TLS handshake, verified against the real CA, against temporal-secure-proxy (temporal-frontend itself has no Prometheus metrics; this confirms the proxy is up and terminating TLS correctly, not that the Bearer-token/gRPC path behind it works end to end).",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 36},
          "targets": [{"refId": "A", "expr": "probe_success{job=\"blackbox-temporal\"}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "UP", "color": "green"}, "0": {"text": "DOWN", "color": "red"}}}], "noValue": "NO DATA"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 21,
          "title": "Middleware: connected, no live metric available",
          "type": "text",
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 42},
          "options": {"mode": "markdown", "content": "**Ollama (LLM backend)** and **Resend (lead notification email)** are wired up and were verified working when connected (a real model check / a real end-to-end test), but neither has a probe/metric here yet - both are one-off/on-demand calls rather than a standing connection, so there's no single endpoint to keep polling the way Permify/TigerBeetle's health checks do."}
        },
        {
          "id": 19,
          "title": "Middleware: still not wired up",
          "type": "text",
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 46},
          "options": {"mode": "markdown", "content": "**SendGrid / SMTP / Twilio** (`server/notifications.ts`) - none of their env vars are set. Unlike everything else on this page, these are alternate notification channels that need real third-party account credentials (a SendGrid account, an SMTP relay, a Twilio account) - not something to wire up from cluster access alone."}
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Outbound calls to Keycloak (by status)",
          "description": "http_client_request_duration_seconds{server_address=...} - the only outbound dependency currently visible with a target-service label. No MinIO/Postgres/Redis/Temporal calls have shown up under this metric family recently (healthpoint doesn't auto-instrument those clients the way it does fetch/HTTP).",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 50},
          "targets": [{"refId": "A", "expr": "sum by (server_address, http_response_status_code) (rate(http_client_request_duration_seconds_count{exported_job=\"healthpoint-api\"}[5m]))", "legendFormat": "{{server_address}} ({{http_response_status_code}})"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "id": 16,
          "type": "table",
          "title": "Pod status (namespace: healthpoint)",
          "description": "Source: kube-state-metrics (kube_pod_status_phase). Filtered to the current active phase per pod - each pod appears once.",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 58},
          "targets": [{"refId": "A", "format": "table", "instant": true, "expr": "kube_pod_status_phase{namespace=\"healthpoint\"} == 1"}],
          "transformations": [
            {"id": "organize", "options": {"excludeByName": {"Time": true, "Value": true, "__name__": true, "instance": true, "job": true, "namespace": true, "uid": true}, "renameByName": {"pod": "Pod", "phase": "Phase"}}}
          ],
          "fieldConfig": {
            "defaults": {"custom": {"cellOptions": {"type": "color-background"}}, "mappings": [
              {"type": "value", "options": {"Running": {"color": "green", "index": 0}, "Succeeded": {"color": "green", "index": 1}, "Pending": {"color": "orange", "index": 2}, "Failed": {"color": "red", "index": 3}, "Unknown": {"color": "red", "index": 4}}}
            ]},
            "overrides": [{"matcher": {"id": "byName", "options": "Phase"}, "properties": [{"id": "custom.cellOptions", "value": {"type": "color-background"}}]}]
          }
        },
        {
          "id": 17,
          "type": "table",
          "title": "Container restarts (namespace: healthpoint)",
          "description": "Source: kube-state-metrics (kube_pod_container_status_restarts_total).",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 58},
          "targets": [{"refId": "A", "format": "table", "instant": true, "expr": "kube_pod_container_status_restarts_total{namespace=\"healthpoint\"}"}],
          "transformations": [
            {"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "instance": true, "job": true, "namespace": true, "uid": true}, "renameByName": {"pod": "Pod", "container": "Container", "Value": "Restarts"}}}
          ],
          "fieldConfig": {
            "defaults": {"custom": {"cellOptions": {"type": "color-background"}}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 6}]}},
            "overrides": []
          }
        },
        {
          "id": 18,
          "title": "Pod logs (namespace: healthpoint)",
          "type": "logs",
          "gridPos": {"x": 0, "y": 66, "w": 24, "h": 12},
          "datasource": {"type": "loki", "uid": "Loki"},
          "options": {"showTime": true, "showLabels": true, "wrapLogMessages": true, "sortOrder": "Descending"},
          "targets": [{"refId": "A", "expr": "{namespace=\"healthpoint\"}", "maxLines": 500}]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-grafana-dashboard-blueeco-fc-cvff-api
  namespace: otel
data:
  blueeco-fc-cvff-api.json: |
    {
      "title": "BlueEco FC CVFF API",
      "uid": "w37-blueeco-fc-cvff-api",
      "description": "Service health for blueeco-fc-cvff-api (namespace: blueeconomy). Panels reflect exactly what this service's own instrumentation emits - no data is fabricated where a panel type doesn't apply (e.g. a service with no inbound HTTP metrics gets no inbound-request panels). Pod status, container restarts, and logs are always real regardless of app-level instrumentation maturity.",
      "tags": [
        "w37",
        "otel",
        "blueeconomy"
      ],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Inbound request rate (req/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_request_duration_seconds_count{exported_job=\"blueeco-fc-cvff-api\"}[5m]))",
              "legendFormat": "Inbound request rate (req/s)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Inbound 5xx ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
