                  "options": {
                    "Running": {
                      "color": "green",
                      "index": 0
                    },
                    "Succeeded": {
                      "color": "green",
                      "index": 1
                    },
                    "Pending": {
                      "color": "orange",
                      "index": 2
                    },
                    "Failed": {
                      "color": "red",
                      "index": 3
                    },
                    "Unknown": {
                      "color": "red",
                      "index": 4
                    }
                  }
                }
              ]
            },
