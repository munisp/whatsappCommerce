kind: ConfigMap
metadata:
  name: otel-grafana-dashboard-tenant-360
  namespace: whatsapp-commerce
  # === W34 otel-sidecars (Coder C) dashboard, configmap+mount added by merger ===
data:
  tenant-360.json: |
    {
      "title": "Tenant 360",
      "uid": "w34-tenant-360",
      "description": "=== W34 otel-sidecars (Coder C) === Per-tenant view: RED metrics for the selected allowlisted tenant (tenant_class label), trace link into Jaeger filtered by tenant.id, and an honest alert-history panel (live from the Alertmanager API; omitted when no Alertmanager datasource is configured \u2014 never static/fake data). W35: kafka/temporal span panels appended (ids 8-11).",
      "tags": [
        "w34",
        "otel",
        "tenant"
      ],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(http_requests_total, tenant_class)",
            "refresh": 2,
            "includeAll": false,
            "multi": false,
            "sort": 1,
            "description": "Only allowlisted tenants appear as themselves; all others are the single 'other' class (cardinality guard, server/services/telemetryCardinality.ts)."
          }
        ]
      },
      "links": [
        {
          "title": "Traces in Jaeger (tenant.id = $tenant)",
          "type": "link",
          "url": "/d/jaeger?var-tenant=$tenant",
          "targetBlank": true,
          "asDropdown": false,
          "icon": "external link",
          "tags": []
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Request rate (req/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{tenant_class=\"$tenant\"}[5m]))",
              "legendFormat": "requests/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error ratio (5xx share)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{tenant_class=\"$tenant\",status_class=\"5xx\"}[5m])) / clamp_min(sum(rate(http_requests_total{tenant_class=\"$tenant\"}[5m])), 1e-9)",
              "legendFormat": "error ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
