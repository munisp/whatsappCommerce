apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: whatsapp-commerce
  labels: {app: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: otel-grafana-admin, key: username, optional: true}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: otel-grafana-admin, key: password, optional: true}}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports:
            - {containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 500m}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources, subPath: datasources.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards, subPath: dashboards.yaml, readOnly: true}
            - {name: dash-red, mountPath: /var/lib/grafana/dashboards/platform-red.json, subPath: platform-red.json, readOnly: true}
            - {name: dash-infra, mountPath: /var/lib/grafana/dashboards/infra-components.json, subPath: infra-components.json, readOnly: true}
            - {name: dash-money, mountPath: /var/lib/grafana/dashboards/money-rails.json, subPath: money-rails.json, readOnly: true}
            - {name: dash-tenant, mountPath: /var/lib/grafana/dashboards/tenant-explorer.json, subPath: tenant-explorer.json, readOnly: true}
            - {name: dash-tenant360, mountPath: /var/lib/grafana/dashboards/tenant-360.json, subPath: tenant-360.json, readOnly: true} # W34 merger: C's tenant-360
            # === W35 infra-receivers (Coder D) ===
            - {name: dash-go-red, mountPath: /var/lib/grafana/dashboards/go-services-red.json, subPath: go-services-red.json, readOnly: true}
            - {name: dash-rust-red, mountPath: /var/lib/grafana/dashboards/rust-services-red.json, subPath: rust-services-red.json, readOnly: true}
            # === END W35 infra-receivers ===
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: provisioning
          configMap: {name: otel-grafana-provisioning}
        - name: dash-red
          configMap: {name: otel-grafana-dashboard-platform-red}
        - name: dash-infra
          configMap: {name: otel-grafana-dashboard-infra-components}
        - name: dash-money
          configMap: {name: otel-grafana-dashboard-money-rails}
        - name: dash-tenant
          configMap: {name: otel-grafana-dashboard-tenant-explorer}
        - name: dash-tenant360
          configMap: {name: otel-grafana-dashboard-tenant-360}
        # === W35 infra-receivers (Coder D) ===
        - name: dash-go-red
          configMap: {name: otel-grafana-dashboard-go-services-red}
        - name: dash-rust-red
          configMap: {name: otel-grafana-dashboard-rust-services-red}
        # === END W35 infra-receivers ===
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: whatsapp-commerce}
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: whatsapp-commerce
  labels: {app: alertmanager}
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager}}
  template:
    metadata: {labels: {app: alertmanager}}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          env:
            # NOTE: alertmanager.yml on disk keeps ${...} placeholders in k8s;
            # wire real SMTP creds via a sealed Secret + envsubst sidecar, or
            # render this ConfigMap from your secrets manager before apply.
            # (compose renders it with sed; k8s path is documented, not faked.)
            - {name: ALERT_EMAIL_TO, valueFrom: {secretKeyRef: {name: otel-alert-smtp, key: to, optional: true}}}
          ports:
            - {containerPort: 9093}
          readinessProbe:
            httpGet: {path: /-/healthy, port: 9093}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 256Mi, cpu: 200m}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-alertmanager-config}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: whatsapp-commerce}
spec:
  selector: {app: alertmanager}
  ports:
    - {name: http, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-wa-bridge
  namespace: whatsapp-commerce
  labels: {app: alertmanager-wa-bridge}
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager-wa-bridge}}
  template:
    metadata: {labels: {app: alertmanager-wa-bridge}}
    spec:
      containers:
        - name: wa-bridge
          image: node:22-alpine
          command: ["node", "/app/alertmanager-wa-bridge.mjs"]
          env:
            - {name: ALERTMANAGER_WA_BRIDGE_ENABLED, value: "false"}  # disabled-default; set "true" to enable
            - {name: WA_BRIDGE_PORT, value: "9099"}
            - {name: PLATFORM_API_URL, value: "http://platform:3000"}
            - {name: INTERNAL_API_KEY, valueFrom: {secretKeyRef: {name: platform-internal, key: INTERNAL_API_KEY, optional: true}}}
            - {name: OPS_ALERT_WHATSAPP, valueFrom: {secretKeyRef: {name: platform-internal, key: OPS_ALERT_WHATSAPP, optional: true}}}
          ports:
            - {containerPort: 9099}
          readinessProbe:
            httpGet: {path: /health, port: 9099}
            initialDelaySeconds: 3
            periodSeconds: 15
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 128Mi, cpu: 100m}
          volumeMounts:
            - {name: src, mountPath: /app, readOnly: true}
      volumes:
        - name: src
          configMap: {name: otel-wa-bridge-src}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager-wa-bridge, namespace: whatsapp-commerce}
spec:
  selector: {app: alertmanager-wa-bridge}
  ports:
    - {name: http, port: 9099, targetPort: 9099}
# === END W34 otel-stack ===
