# Persistent storage for Grafana's own internal DB (folders, org/user prefs,
# star settings, annotations). Previously an emptyDir, which meant every pod
# restart (this file gets applied/Grafana restarted often) silently wiped
# folder UIDs - dashboards themselves survived (re-provisioned fresh from the
# ConfigMap JSON, which pins their own uid), but any bookmarked/cached link
# to a folder page broke with a fresh random UID each time. Confirmed live:
# hit exactly this after a routine restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: otel
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel
  labels: {app: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: otel-grafana-admin, key: username, optional: true}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: otel-grafana-admin, key: password, optional: true}}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports:
            - {containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 500m}
          volumeMounts:
            # mountPath targets the file itself, not its parent directory:
            # Grafana's base image already ships these as real directories,
            # so subPath-mounting a single ConfigMap key AT the directory
            # path fails at the OCI runtime level ("not a directory") - the
            # mount has to land on a specific filename inside it instead.
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: dash-red, mountPath: /var/lib/grafana/dashboards/platform-red.json, subPath: platform-red.json, readOnly: true}
            - {name: dash-infra, mountPath: /var/lib/grafana/dashboards/infra-components.json, subPath: infra-components.json, readOnly: true}
            - {name: dash-money, mountPath: /var/lib/grafana/dashboards/money-rails.json, subPath: money-rails.json, readOnly: true}
            - {name: dash-tenant, mountPath: /var/lib/grafana/dashboards/tenant-explorer.json, subPath: tenant-explorer.json, readOnly: true}
