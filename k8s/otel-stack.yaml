apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-grafana-dashboard-54link-dev
  namespace: otel
data:
  54link-dev.json: |
    {
      "title": "54link-dev (namespace)",
      "uid": "w38-54link-dev",
      "description": "All 31 services in the 54link-dev namespace, as a single namespace-wide view rather than one dashboard per service. Most sit at 0 replicas as their baseline (a demo/test namespace scaled up on demand) - the Dapr sidecar tracing config (Dapr Configuration 'daprsystem' in this namespace, wired 2026-09-14) exports real request-level data to the shared otel-collector for any of them the moment they're scaled up, with zero app code changes. Verified end to end on core-accounts. RED panels below aggregate across whichever of the 31 are currently emitting - empty when everything's at rest, which is the honest, expected state.",
      "tags": [
        "w38",
        "otel",
        "54link-dev",
        "dapr"
      ],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Services currently emitting data",
          "description": "count(count by (exported_job)(otel_span_calls_total{exported_job=~\"<31 known service names>\"})) - how many of the 31 are actively running and traced right now, out of 31.",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(count by (exported_job) (otel_span_calls_total{exported_job=~\"ai-ml-inference|beneficial-ownership-go|bulk-payments-rs|business-service|channels-agents|channels-messaging|cheque-clearing-go|communication-hub|compliance-fraud|compliance-regulatory|compliance-risk|core-accounts|core-cards|core-deposits|core-lending|core-payments|customer-management|customer-pricing|dormancy-management-rs|employee-service|eod-processor-go|erp-integration|esusu-service|etherisc-service|fee-management-go|identity-auth|infra-database|interest-rate-engine-go|ledger-gl|ledger-reconciliation|mandate-management-go\"}))",
              "legendFormat": "active / 31"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
