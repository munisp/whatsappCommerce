    {
      "title": "NDSEP API",
      "uid": "w37-ndsep-api",
      "description": "Service health for ndsep-api (namespace: ndsep). Panels reflect exactly what this service's own instrumentation emits - no data is fabricated where a panel type doesn't apply (e.g. a service with no inbound HTTP metrics gets no inbound-request panels). Pod status, container restarts, and logs are always real regardless of app-level instrumentation maturity.",
