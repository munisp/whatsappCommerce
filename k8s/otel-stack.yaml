            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=~\"pg-oracle|pg-54agent|pg-54link-dev|pg-ucard|pg-ndsep|pg-vpp|pg-meridian|keycloak-postgres|permify-postgres|farmer-data-collection-postgres|gds-postgres|insurance-demo-postgres|lanai-postgres|nsep-demo-postgres|paymenthub-postgres|tourismpay-postgres|fineract-postgres|redis|mojaloop-auth-svc-redis|mojaloop-proxy-cache-redis|mojaloop-ttksims-redis|insurance-demo-redis|novu-redis|mongodb|ttk-mongodb|novu-mongodb|mysql|kafka|qdrant|minio|temporal-elasticsearch|etcd|dapr-placement-server|dapr-scheduler-server\"})",
              "legendFormat": "targets scraping OK"
