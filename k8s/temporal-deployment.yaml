apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: whatsapp-commerce
  labels:
    app: temporal
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: whatsapp-commerce-platform
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: whatsapp-commerce-platform
        version: v1
    spec:
      securityContext:
        # temporalio/server (and auto-setup) run as the non-root "temporal" user.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          # Pinned (was :latest).
          image: temporalio/auto-setup:1.24.2
          ports:
            - containerPort: 7233
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: TEMPORAL_DB_PASSWORD
            - name: POSTGRES_SEEDS
              value: temporal-db
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Temporal frontend gRPC — no HTTP health endpoint on 7233; TCP probe
          # is the correct check (matches docker-compose dependency behavior).
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-db
  namespace: whatsapp-commerce
  labels:
    app: temporal-db
    app.kubernetes.io/name: temporal-db
    app.kubernetes.io/part-of: whatsapp-commerce-platform
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-db
  template:
    metadata:
      labels:
        app: temporal-db
        app.kubernetes.io/name: temporal-db
        app.kubernetes.io/part-of: whatsapp-commerce-platform
        version: v1
    spec:
      securityContext:
        # postgres:16-alpine runs as postgres (uid/gid 70).
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: TEMPORAL_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: temporal-db-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-d", "temporal"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-d", "temporal"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: temporal-db-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: whatsapp-commerce
  labels:
    app: temporal
    app.kubernetes.io/part-of: whatsapp-commerce-platform
spec:
  selector:
    app: temporal
  ports:
    - port: 7233
      targetPort: 7233
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-db
  namespace: whatsapp-commerce
  labels:
    app: temporal-db
    app.kubernetes.io/part-of: whatsapp-commerce-platform
spec:
  selector:
    app: temporal-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
