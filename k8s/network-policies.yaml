# ── 19. Prometheus scrape path (monitoring namespace) ────────────────────────
# Only the two real Prometheus-text exporters: apisix :9091 and
# hermes-router :8096 (see k8s/monitoring/servicemonitors.yaml; every other
# service either has no /metrics or serves JSON, documented in
# docs/ZERO_TRUST.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: whatsapp-commerce
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9091   # apisix prometheus export
          protocol: TCP
        - port: 8096   # hermes-router /metrics
          protocol: TCP
