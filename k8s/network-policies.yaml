# ═════════════════════════════════════════════════════════════════════════════
# ZERO-TRUST NETWORK POLICIES — whatsapp-commerce
# ═════════════════════════════════════════════════════════════════════════════
# Model (see docs/ZERO_TRUST.md for evidence and the full flow matrix):
#   * k8s/network-policy.yaml applies default-deny ingress+egress to ALL pods.
#   * This file adds explicit, least-privilege allows. A connection is only
#     possible when the SOURCE pod has an egress allow AND the DESTINATION pod
#     has an ingress allow (NetworkPolicies are additive).
#   * Only ingress-nginx → apisix:9080 (and → api-gateway:8080, the platform
#     gateway) may enter the namespace from outside.
# ═════════════════════════════════════════════════════════════════════════════

# ── 1. DNS egress for every pod (kube-dns / CoreDNS) ─────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: whatsapp-commerce
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ── 2. External entry: ingress-nginx → apisix (edge data plane) ──────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-apisix
  namespace: whatsapp-commerce
spec:
  podSelector:
    matchLabels:
      app: apisix
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 9080
          protocol: TCP
---
# ── 3. External entry: ingress-nginx → api-gateway (gateway←ingress) ─────────
# The shipped Ingress (k8s/ingress.yaml) targets apisix only; this allow also
# permits direct gateway ingress for clusters that terminate webhooks at the
# gateway. Both paths are edge-only — no other Service is reachable from
# outside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api-gateway
  namespace: whatsapp-commerce
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - port: 8080
          protocol: TCP
---
# ── 4. apisix egress → api-gateway (the only configured upstream, per
#       services/middleware/apisix_conf/apisix.yaml: /api/* → api-gateway:8080) ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-egress
  namespace: whatsapp-commerce
spec:
  podSelector:
    matchLabels:
      app: apisix
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
          protocol: TCP
---
# ── 5. api-gateway egress → downstream services ──────────────────────────────
# Mission-required: gateway→commerce-engine/ml-stack/ledger-bridge.
# Additional allows are the gateway's declared dependencies (docker-compose
# api-gateway env: REDIS_URL, KEYCLOAK_URL, PERMIFY_URL, APISIX_ADMIN_URL,
# TEMPORAL_ADDRESS, AI_AGENT_URL; platform API proxied via APISIX upstream).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-egress
  namespace: whatsapp-commerce
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: commerce-engine
      ports:
        - port: 8083
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: ml-inference
      ports:
        - port: 8099
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: ledger-bridge
      ports:
        - port: 8095
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: ai-agent
      ports:
        - port: 8090
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: platform
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: permify
      ports:
        - port: 3476
          protocol: TCP
        - port: 3478
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: temporal
      ports:
        - port: 7233
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - port: 9180   # APISIX admin API (route registration)
          protocol: TCP
---
# ── 6. platform (server) egress → postgres/redis/keycloak/temporal/permify ──
# Plus its other code-verified dependencies: Kafka (configmap KAFKA_BROKERS in
# the kafka namespace), ml-inference + ledger-bridge (infra health fans out to
# :8099/:8095 — server/routers/infra.ts), and 443 for the Meta WhatsApp Graph
# API / payment providers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-egress
  namespace: whatsapp-commerce
spec:
  podSelector:
    matchLabels:
      app: platform
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: temporal
      ports:
        - port: 7233
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: permify
      ports:
        - port: 3476
          protocol: TCP
        - port: 3478
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: ml-inference
      ports:
        - port: 8099
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: ledger-bridge
      ports:
        - port: 8095
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - port: 9092
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443   # Meta Graph API, payment providers (HTTPS only)
          protocol: TCP
---
# ── 7. commerce-engine egress ────────────────────────────────────────────────
# Deps (docker-compose commerce-engine env + internal/temporal/client.go):
# postgres, redis, temporal, platform (/api/health/temporal).
