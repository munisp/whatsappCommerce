# Primary platform Postgres (database whatsapp_commerce, user wc_user) —
# mirrors docker-compose postgres service.
#
# W39 durability (PLT-1): the data volume is now a PersistentVolumeClaim
# (postgres-data, 10Gi) instead of emptyDir — previously ANY pod restart
# destroyed the entire platform database.
# Minimal-change choice (documented per SPEC_W39): standalone PVC + keep the
# existing Deployment (strategy: Recreate, replicas 1) instead of converting
# to a StatefulSet. Rationale: single-replica dev overlay; Recreate already
# guarantees at-most-one writer so a ReadWriteOnce PVC is safe; a StatefulSet
# conversion would rename the pod/selector identity (postgres-0) and force
# coordinated edits to every Service consumer for zero durability gain here.
# tmp/run stay emptyDir on purpose: they hold only ephemeral sockets/pids and
# MUST NOT survive a restart (stale postmaster.pid would block recovery).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: whatsapp-commerce
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: whatsapp-commerce-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Dev overlay: honest floor for a small cluster; raise per environment.
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: whatsapp-commerce
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: whatsapp-commerce-platform
    version: v1
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: whatsapp-commerce-platform
        version: v1
    spec:
      securityContext:
        # postgres:16-alpine runs as postgres (uid/gid 70).
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: whatsapp_commerce
            - name: POSTGRES_USER
              value: wc_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wc_user", "-d", "whatsapp_commerce"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "wc_user", "-d", "whatsapp_commerce"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        # Ephemeral-by-design (sockets/pids); see header comment.
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: whatsapp-commerce
  labels:
    app: postgres
    app.kubernetes.io/part-of: whatsapp-commerce-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
