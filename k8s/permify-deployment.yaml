apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: whatsapp-commerce
  labels:
    app: permify
    app.kubernetes.io/name: permify
    app.kubernetes.io/part-of: whatsapp-commerce-platform
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: permify
  template:
    metadata:
      labels:
        app: permify
        app.kubernetes.io/name: permify
        app.kubernetes.io/part-of: whatsapp-commerce-platform
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: permify
          # Pinned (was :latest).
          image: permify/permify:v1.2.4
          args: ["serve"]
          ports:
            - containerPort: 3476   # REST
            - containerPort: 3478   # gRPC
          env:
            # NOTE: $(VAR) expansion requires the var to be declared first.
            - name: PERMIFY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PERMIFY_DB_PASSWORD
            - name: PERMIFY_DATABASE_ENGINE
              value: postgres
            - name: PERMIFY_DATABASE_URI
              value: postgres://permify:$(PERMIFY_DB_PASSWORD)@permify-db:5432/permify?sslmode=disable
            - name: PERMIFY_DATABASE_AUTO_MIGRATE
              value: "true"
            - name: PERMIFY_LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Probe path verified: GET /healthz — permify serve (docker-compose
          # healthcheck curls http://localhost:3476/healthz).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify-db
  namespace: whatsapp-commerce
  labels:
    app: permify-db
    app.kubernetes.io/name: permify-db
    app.kubernetes.io/part-of: whatsapp-commerce-platform
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: permify-db
  template:
    metadata:
      labels:
        app: permify-db
        app.kubernetes.io/name: permify-db
        app.kubernetes.io/part-of: whatsapp-commerce-platform
        version: v1
    spec:
      securityContext:
        # postgres:16-alpine runs as postgres (uid/gid 70).
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: permify
            - name: POSTGRES_USER
              value: permify
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PERMIFY_DB_PASSWORD
            # PGDATA subdir avoids lost+found permission issues on the volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: permify-db-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "permify", "-d", "permify"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "permify", "-d", "permify"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: permify-db-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: whatsapp-commerce
  labels:
    app: permify
    app.kubernetes.io/part-of: whatsapp-commerce-platform
spec:
  selector:
    app: permify
  ports:
    - name: http
      port: 3476
      targetPort: 3476
    - name: grpc
      port: 3478
      targetPort: 3478
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: permify-db
  namespace: whatsapp-commerce
  labels:
    app: permify-db
    app.kubernetes.io/part-of: whatsapp-commerce-platform
spec:
  selector:
    app: permify-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
