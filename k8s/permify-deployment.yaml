apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: whatsapp-commerce
  labels:
    app: permify
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: permify
  template:
    metadata:
      labels:
        app: permify
        version: v1
    spec:
      containers:
        - name: permify
          image: permify/permify:latest
          args: ["serve"]
          ports:
            - containerPort: 3476   # REST
            - containerPort: 3478   # gRPC
          env:
            # NOTE: $(VAR) expansion requires the var to be declared first.
            - name: PERMIFY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PERMIFY_DB_PASSWORD
            - name: PERMIFY_DATABASE_ENGINE
              value: postgres
            - name: PERMIFY_DATABASE_URI
              value: postgres://permify:$(PERMIFY_DB_PASSWORD)@permify-db:5432/permify?sslmode=disable
            - name: PERMIFY_DATABASE_AUTO_MIGRATE
              value: "true"
            - name: PERMIFY_LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify-db
  namespace: whatsapp-commerce
  labels:
    app: permify-db
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: permify-db
  template:
    metadata:
      labels:
        app: permify-db
        version: v1
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: permify
            - name: POSTGRES_USER
              value: permify
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PERMIFY_DB_PASSWORD
          volumeMounts:
            - name: permify-db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "permify", "-d", "permify"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: permify-db-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: whatsapp-commerce
spec:
  selector:
    app: permify
  ports:
    - name: http
      port: 3476
      targetPort: 3476
    - name: grpc
      port: 3478
      targetPort: 3478
---
apiVersion: v1
kind: Service
metadata:
  name: permify-db
  namespace: whatsapp-commerce
spec:
  selector:
    app: permify-db
  ports:
    - port: 5432
      targetPort: 5432
