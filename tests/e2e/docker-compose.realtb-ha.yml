# Second ledger-bridge replica (with its own adapter sidecar), sharing ONE Postgres and ONE TigerBeetle
# with the first — exactly how two bridge pods run in the cluster. Layer on top of the real-TigerBeetle
# overlay:
#
#   docker compose -f docker-compose.test.yml -f docker-compose.realtb.yml -f docker-compose.realtb-ha.yml up
#
# tests/e2e/ledger-ha.test.ts uses LEDGER_URL_2 to prove that idempotency, commit/void/reverse and
# concurrency hold ACROSS replicas before the bridge is scaled past one replica.
services:
  tb-adapter-2:
    build:
      context: ../../services/tb-adapter
    security_opt: ["seccomp=unconfined"]
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      TB_CLUSTER_ID: "0"
      TB_ADDRESSES: tigerbeetle:3000
    depends_on:
      - tigerbeetle
    ports:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

  ledger-bridge-2:
    image: wc-e2e-ledger-bridge:latest
    environment:
      PORT: "8095"
      TIGERBEETLE_ADDRESS: tb-adapter-2:3000
      TIGERBEETLE_CLUSTER_ID: "0"
      LEDGER_ALLOW_INMEMORY: "false"
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      RUST_LOG: info
    ports:
      - "8095"
    depends_on:
      postgres:
        condition: service_healthy
      tb-adapter-2:
        condition: service_healthy
