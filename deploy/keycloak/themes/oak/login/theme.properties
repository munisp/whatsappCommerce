# OAK login theme: keycloak.v2's pages and behaviour, with the OAK look over the top.
# Select it per realm: Realm settings -> Themes -> Login theme = oak.
# Keycloak shares this server with other apps; this affects only realms that select it.
parent=keycloak.v2
darkMode=false
# Bump the number in the CSS file's name on every change: Cloudflare caches theme files by path for 30 days.
styles=css/styles.css css/oak-login-2.css
