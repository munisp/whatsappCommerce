# CI (assurance A4-18) — install → typecheck → unit tests → prod audit gate.
#
# Notes:
# - `--legacy-peer-deps` is REQUIRED (repo reality): @builder.io/vite-plugin-jsx-loc
#   declares vite ^4/^5 while the repo pins vite ^7, so plain `npm ci` fails
#   ERESOLVE. The Dockerfile uses the same flag.
# - The audit gate is BLOCKING at --audit-level=high on production deps only.
#   After the drizzle-orm ^0.45.2 bump (A4-01) `npm audit --omit=dev`
#   reports 0 vulnerabilities. Remaining advisories are dev-scope only
#   (vitest ≤3.2.5 critical UI file-read, transitive vite/esbuild moderate —
#   dev/CI-host impact, not shipped runtime) and are tracked separately;
#   they do not affect `npm audit --omit=dev`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production dependency audit (blocking at high)
        run: npm audit --omit=dev --audit-level=high

      # SOC2 controls self-check (CC4.4) — REQUIRED (W30, V3#19): control
      # drift now blocks the pipeline instead of passing silently.
      - name: SOC2 controls self-check
        run: npx tsx scripts/soc2-check.ts

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI result"
            echo ""
            echo "- typecheck + vitest + prod audit: see step outcomes above"
            echo "- audit scope: production deps only (\`--omit=dev\`), blocking at high"
            echo "- drizzle-orm pinned ≥0.45.2 (A4-01 SQLi fix)"
          } >> "$GITHUB_STEP_SUMMARY"

  # CV stack gate: visual-inventory python tests (incl. accuracy benchmark),
  # Go orchestrator build, Rust bbox post-processor check.
  # Heavy ML deps (ultralytics/torch/transformers) stay lazy/optional — the
  # test suite is importable with only the light deps installed.
  cv-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Detect visual-inventory changes
        id: cv_changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^services/visual-inventory/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cv_changed.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install python test deps (light deps only; ML deps stay lazy)
        if: steps.cv_changed.outputs.run == 'true'
        working-directory: services/visual-inventory/python-vlm
        run: pip install fastapi "uvicorn[standard]" python-multipart httpx Pillow numpy pydantic pydantic-settings structlog pytest

      - name: Python pytest (merge contract, price utils, batch dedup, drift hook)
        if: steps.cv_changed.outputs.run == 'true'
        working-directory: services/visual-inventory/python-vlm
        run: python -m pytest tests/ -q

      - name: Python benchmark accuracy gate
        if: steps.cv_changed.outputs.run == 'true'
        working-directory: services/visual-inventory/python-vlm
        run: python -m pytest benchmark/ -q && python benchmark/runner.py

      - uses: actions/setup-go@v5
        if: steps.cv_changed.outputs.run == 'true'
        with:
          go-version: "1.23"

      - name: Go orchestrator build
        if: steps.cv_changed.outputs.run == 'true'
        working-directory: services/visual-inventory/go-orchestrator
        run: go build ./...

      - name: Rust bbox check
        if: steps.cv_changed.outputs.run == 'true'
        working-directory: services/visual-inventory/rust-bbox
        run: cargo check

  # W30 (V3#19): build the platform + scheduler Docker images so a broken
  # Dockerfile can never reach main undetected.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build platform image
        run: docker build -t whatsapp-commerce/platform:ci -f Dockerfile .

      - name: Build scheduler image
        run: docker build -t whatsapp-commerce/scheduler:ci services/scheduler
