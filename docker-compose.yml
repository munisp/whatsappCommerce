version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  platform:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  tigerbeetle_data:
  keycloak_db_data:
  temporal_db_data:
  permify_db_data:

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsapp_commerce
      POSTGRES_USER: wc_user
      POSTGRES_PASSWORD: wc_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wc_user -d whatsapp_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [platform]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks: [platform]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    networks: [platform]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Identity: Keycloak ─────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_2026}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # Host port 8180 (8080 is taken by api-gateway); internal URL is http://keycloak:8080
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_2026}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_2026}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./services/keycloak/config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      # keycloak image is ubi9-minimal (bash, no curl) — probe via /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ─── Workflows: Temporal ────────────────────────────────────────────────────
  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-db
    ports:
      - "7233:7233"
    depends_on:
      temporal-db:
        condition: service_healthy
    networks: [platform]
    restart: unless-stopped

  # ─── Authorization: Permify ─────────────────────────────────────────────────
  permify-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permify
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: ${PERMIFY_DB_PASSWORD:-permify}
    volumes:
      - permify_db_data:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permify -d permify"]
      interval: 10s
      timeout: 5s
      retries: 10

  permify:
    image: permify/permify:latest
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://permify:${PERMIFY_DB_PASSWORD:-permify}@permify-db:5432/permify?sslmode=disable
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
      PERMIFY_LOG_LEVEL: info
    ports:
      - "3476:3476"   # REST
      - "3478:3478"   # gRPC
    volumes:
      # Authorization schema (tenant/order/product ownership) — write to Permify
      # via POST /v1/tenants/{tenant_id}/schemas/write after first boot.
      - ./services/middleware/permify-schema.perm:/etc/permify/schema.perm:ro
    depends_on:
      permify-db:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3476/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── API Gateway: APISIX (standalone, etcd-less) ───────────────────────────
  apisix:
    image: apache/apisix:3.9.1
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
    ports:
      - "9080:9080"   # data plane (HTTP)
      - "9180:9180"   # admin API
    volumes:
      - ./services/middleware/apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./services/middleware/apisix_conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-API-KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}' http://localhost:9180/apisix/admin/routes || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Ledger: TigerBeetle ────────────────────────────────────────────────────
  # Format the data file once, then start the replica.
  tigerbeetle-init:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    command: ["format", "--cluster=0", "--replica=0", "--replica-count=1", "--development", "/data/0_0.tigerbeetle"]
    volumes:
      - tigerbeetle_data:/data
    networks: [platform]

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    command: ["start", "--addresses=0.0.0.0:3000", "--development", "/data/0_0.tigerbeetle"]
    ports:
      # Host port 3001 (was 3000, which collided with the platform service).
      # In-cluster traffic uses the internal DNS name tigerbeetle:3000.
      - "${TIGERBEETLE_HOST_PORT:-3001}:3000"
    volumes:
      - tigerbeetle_data:/data
    depends_on:
      tigerbeetle-init:
        condition: service_completed_successfully
    networks: [platform]
    restart: unless-stopped

  # ─── ML Inference (Python, CPU-only) ────────────────────────────────────────
  # ─── TypeScript Platform (Express + tRPC monolith) ─────────────────────────
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Cap V8 old-space at 2GB per replica; see docs/PERF.md (heap experiment).
      NODE_OPTIONS: "--max-old-space-size=2048"
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      REDIS_URL: redis://redis:6379
      # PG pool size per replica (see docs/PERF.md for the 100k math).
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      # ── W30 boot-gate completeness (server/_core/env.ts REQUIRED_BY_ENV) ──
      # Dev-safe defaults so `docker compose up platform` boots out of the box;
      # OVERRIDE every one of these in any real deployment (see env.example.txt).
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # base64-encoded 32 bytes ("dev-master-key-0123456789abcde") — dev only.
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-ZGV2LW1hc3Rlci1rZXktMDEyMzQ1Njc4OWFiY2Rl}
      # Dev-only KYC service key (must match the kyc-verifier sidecar env).
      KYC_SERVICE_API_KEY: ${KYC_SERVICE_API_KEY:-dev-only-kyc-key-change-in-prod}
      # Dev-only Meta webhook verification token (never the public demo value).
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-only-wa-verify-token-change-in-prod}
      # ── W30 service wiring (V3#4/#8): internal DNS, not localhost ──
      HERMES_BRIDGE_URL: ${HERMES_BRIDGE_URL:-http://hermes-bridge:8096}
      RECON_WORKER_URL: ${RECON_WORKER_URL:-http://recon-worker:8096}
      ML_STACK_URL: ${ML_STACK_URL:-http://ml-inference:8099}
      # Mojaloop webhook signature validation — ON by default (V3 align D#14).
      # The bundled mojaloop-simulator is a DEV-ONLY stub; point MOJALOOP_API_URL
      # at a real Mojaloop deployment for anything beyond local development.
      MOJALOOP_VALIDATE_SIG: ${MOJALOOP_VALIDATE_SIG:-true}
      # Shared service-to-service secret forwarded as X-Internal-Token.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Cron scheduler auth secret (HS256) used by the scheduler service to
      # call /api/scheduled/* routes. Empty disables local cron auth; the
      # dev default matches the scheduler service below — override in prod.
      CRON_JWT: ${CRON_JWT:-dev-only-cron-secret-change-in-prod}
      # KYC document-verification sidecar (internal DNS; mock only in dev).
      KYC_SERVICE_URL: ${KYC_SERVICE_URL:-http://kyc-verifier:8001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  # ─── KYC document-verification sidecar (Python) ───────────────────────────
  # The image default is VLM_MOCK_MODE=false (real vision via Ollama/GPT-4V).
  # DEV-ONLY: compose explicitly opts into the mock below so a local stack
  # boots without a VLM backend; REMOVE the override (and set OLLAMA_URL or
  # OPENAI_API_KEY) in any real deployment. The platform boot gate probes
  # /health and refuses to serve in production while the sidecar reports mock.
  kyc-verifier:
    build:
      context: ./services/kyc-verifier
      dockerfile: Dockerfile
    environment:
      PORT: "8001"
      VLM_MOCK_MODE: ${VLM_MOCK_MODE:-true} # DEV-ONLY override — see above
      KYC_INTERNAL_API_KEY: ${KYC_SERVICE_API_KEY:-dev-only-kyc-key-change-in-prod}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  # ─── Cron scheduler (W30, V3#3) ──────────────────────────────────────────
  # Invokes every /api/scheduled/* route on its documented cadence with a
  # locally-signed cron JWT. Route allowlist + cadences: services/scheduler/
  # scheduler.mjs (kept in parity with server/_core/index.ts by journey J178).
  scheduler:
    build:
      context: ./services/scheduler
      dockerfile: Dockerfile
    environment:
      PLATFORM_URL: http://platform:3000
      CRON_JWT: ${CRON_JWT:-dev-only-cron-secret-change-in-prod}
      TICK_MS: "15000"
    depends_on:
      platform:
        condition: service_started
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  ml-inference:
    build:
      context: ./services/ml-stack
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
      MODEL_DIR: /app/models
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      PLATFORM_API_URL: http://platform:3000
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:-dev-key}
      # Shared service-to-service secret (X-Internal-Token)
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  # ─── Fluvio (external cluster) ──────────────────────────────────────────────
  # Fluvio is intentionally NOT containerized here. Run a real cluster instead:
  #   - local:   fluvio cluster start            (k8s/minikube via Fluvio CLI)
  #   - cloud:   InfinyOn Cloud (https://infinyon.com)
  # Then point services at it via FLUVIO_ENDPOINT (default http://fluvio-sc:9003).
  # fluvio-sc:
  #   image: infinyon/fluvio:0.11.11
  #   command: run sc --local
  #   ports:
  #     - "9003:9003"
  #   volumes:
  #     - fluvio_data:/var/lib/fluvio
  #   networks: [platform]

  # ─── Go Services ──────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WEBHOOK_INGESTOR_URL: http://webhook-ingestor:8081
      CONVERSATION_ORCHESTRATOR_URL: http://conversation-orchestrator:8082
      COMMERCE_ENGINE_URL: http://commerce-engine:8083
      PAYMENT_ORCHESTRATOR_URL: http://payment-orchestrator:8084
      AI_AGENT_URL: http://ai-agent:8090
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      REDIS_URL: redis://redis:6379
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
      PERMIFY_URL: http://permify:3476
      PERMIFY_TENANT_ID: ${PERMIFY_TENANT_ID:-t1}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-wacommerce}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-wacommerce-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      ML_STACK_URL: http://ml-inference:8099
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-whatsapp-commerce}
      FLUVIO_ENDPOINT: ${FLUVIO_ENDPOINT:-http://fluvio-sc:9003}
      OPENAPPSEC_ENABLED: ${OPENAPPSEC_ENABLED:-false}
      OPENAPPSEC_SHARED_SECRET: ${OPENAPPSEC_SHARED_SECRET:-}
      # Shared service-to-service secret; the gateway forwards it as
      # X-Internal-Token to internal services it proxies to.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      permify:
        condition: service_started
      apisix:
        condition: service_started
      temporal:
        condition: service_started
      ml-inference:
        condition: service_started
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  webhook-ingestor:
    build:
      context: ./services/webhook-ingestor
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  conversation-orchestrator:
    build:
      context: ./services/conversation-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      AI_AGENT_URL: http://ai-agent:8090
      # ai-agent (/intent, /recommend, /handoff-summary) requires this as
      # X-Internal-Token on service-to-service calls.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  commerce-engine:
    build:
      context: ./services/commerce-engine
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-whatsapp-commerce}
      # Shared service-to-service secret (X-Internal-Token) for internal calls.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  payment-orchestrator:
    build:
      context: ./services/payment-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      MOJALOOP_API_URL: ${MOJALOOP_API_URL:-http://mojaloop-simulator:3000}
      TIGERBEETLE_URL: ${TIGERBEETLE_URL:-tigerbeetle:3000}
      # Shared service-to-service secret (X-Internal-Token) for downstream calls.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Token this service requires in X-Internal-Token on every route except
      # /health (fail-closed outside development when unset).
      PAYMENT_ORCHESTRATOR_INTERNAL_TOKEN: ${PAYMENT_ORCHESTRATOR_INTERNAL_TOKEN:-}
      # Explicit platform escrow ledger account (UUID/hex/decimal) used as the
      # credit side of escrow reservations.
      PLATFORM_ESCROW_ACCOUNT_ID: ${PLATFORM_ESCROW_ACCOUNT_ID:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  # ─── Rust Services ────────────────────────────────────────────────────────
  event-processor:
    build:
      context: ./rust/event-processor
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  ledger-bridge:
    build:
      context: ./rust/ledger-bridge
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      PORT: "8095"
      TIGERBEETLE_ADDRESS: ${TIGERBEETLE_ADDRESS:-tigerbeetle:3000}
      TIGERBEETLE_CLUSTER_ID: ${TIGERBEETLE_CLUSTER_ID:-0}
      # Explicit platform escrow account credited by /ledger/reserve. Must be a
      # valid ledger account id (decimal u128, 32-char hex, or UUID); required
      # on the TigerBeetle path — there is no hardcoded fallback account.
      PLATFORM_ESCROW_ACCOUNT_ID: ${PLATFORM_ESCROW_ACCOUNT_ID:-}
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_started
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  recon-worker:
    build:
      context: ./rust/recon-worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      LEDGER_BRIDGE_URL: http://ledger-bridge:8095
      RECON_INTERVAL_SECS: "3600"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  # ─── Python AI Agent ──────────────────────────────────────────────────────
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      REDIS_URL: redis://redis:6379
      COMMERCE_ENGINE_URL: http://commerce-engine:8083
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-placeholder}
      # Required X-Internal-Token secret for /intent, /recommend, /handoff-summary
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped


  # ─── Hermes Agent Integration Layer ─────────────────────────────────────────
  # Go: Event Gateway — Kafka consumer → Hermes Cloud API forwarder
  hermes-bridge:
    build:
      context: ./services/hermes-bridge
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
    environment:
      PORT: "8096"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      HERMES_AGENT_URL: ${HERMES_AGENT_URL:-https://api.hermes-agent.com}
      HERMES_API_KEY: ${HERMES_API_KEY:-placeholder}
      PLATFORM_API_URL: http://platform:3000
      PLATFORM_HMAC_SECRET: ${PLATFORM_HMAC_SECRET:-dev-secret}
      HERMES_SKILLS_URL: http://hermes-skills:8097
      # /hermes/ingest and /hermes/approval require X-Internal-Token matching
      # this shared secret; also sent on downstream calls to hermes-skills.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  # Rust: Message Router — high-throughput fan-out with circuit breaker and DLQ
  hermes-router:
    build:
      context: ./rust/hermes-router
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      HERMES_BRIDGE_URL: http://hermes-bridge:8096
      HERMES_SKILLS_URL: http://hermes-skills:8097
      # /ingest requires X-Internal-Token matching this secret; also sent on
      # downstream internal calls to hermes-bridge / hermes-skills.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      CIRCUIT_BREAKER_THRESHOLD: "5"
      CIRCUIT_BREAKER_TIMEOUT_SECS: "30"
      MAX_RETRY_ATTEMPTS: "3"
      RUST_LOG: info
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped

  # Python: Skills Executor — PO generation, supplier email, WooCommerce sync
  hermes-skills:
    build:
      context: ./ai-agent/hermes_skills
      dockerfile: Dockerfile
    ports:
      - "8097:8097"
    environment:
      PORT: "8097"
      DATABASE_URL: postgres://wc_user:wc_secret@postgres:5432/whatsapp_commerce?sslmode=disable
      REDIS_URL: redis://redis:6379
      PLATFORM_API_URL: http://platform:3000
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:-dev-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      # /skills/* requires X-Internal-Token matching this shared secret.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [platform]
    logging: *default-logging
    restart: unless-stopped
